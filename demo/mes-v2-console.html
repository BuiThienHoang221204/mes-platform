        '<div class="acts"><span class="pill">chờ quét</span>' +
        '<span class="pill acc">bấm dòng để nạp mã vào ô quét</span></div></div>').join('');

      // Gộp theo MO: 1 MO = 1 row, cột Line hiển thị L01, L02
      const mosWithRuns = h.filter(mo => runsOf(mo).length).sort((a, b) => a.code.localeCompare(b.code));
      function moAggregatedRow(mo) {
        const rs = runsOf(mo);
        const linesTxt = rs.map(r => 'L' + String(r.line).padStart(2, '0')).join(', ');
        const tgCho = rs.length ? dur(Math.max(...rs.map(r => waitMs(r)))) : '—';
        const tgThuc = rs.length ? dur(Math.max(...rs.map(r => actualMs(r)))) : '—';
        const hasRun = rs.some(r => r.status === 'RUN');
        const hasWait = rs.some(r => r.status === 'WAIT');
        const held = heldRuns(mo);
        let st = hasRun ? '<span class="pill acc">Đang lắp ráp</span>'
          : hasWait ? '<span class="pill">Chờ xử lý</span>'
            : '<span class="pill ok">Hoàn thành</span>';
        if (held.length) st += ' <span class="pill bad">ĐANG DỪNG ' + esc(lineList(held)) + '</span>' +
          '<span class="calc late">' + esc(held[0].holdReason || 'chưa ghi lý do') + '</span>';
        const acts = hasRun ? '<button class="btn sm" data-act="mo-pause" data-mo="' + mo.id + '">Dừng</button>'
          : hasWait ? '<button class="btn primary sm" data-act="mo-run-start" data-mo="' + mo.id + '">Đang lắp ráp</button>'
            : '<span class="pill">đóng theo MO</span>';
        const holdForm = S.ui.hold === mo.id
          ? '<tr><td colspan="11"><div class="inline-form"><span class="lb">Lý do dừng (bắt buộc §17)</span>' +
          '<input type="text" id="hold-' + mo.id + '" value="Hỏng máy — kẹt cữ đẩy" style="flex:1;min-width:200px">' +
          '<button class="btn danger sm" data-act="mo-hold-ok" data-mo="' + mo.id + '">Xác nhận dừng ' +
          esc(lineList(rs.filter(r => r.status === 'RUN'))) + '</button>' +
          '<button class="btn ghost sm" data-act="mo-hold-cancel" data-mo="' + mo.id + '">Hủy</button></div></td></tr>' : '';
        return '<tr><td class="c">' + esc(mo.code) + '</td><td>' + esc(mo.product) + '</td>' +
          '<td class="n">' + nfmt(mo.qty) + '</td><td class="n">' + esc(linesTxt) + '</td>' +
          '<td class="n">' + dur(requiredMs(mo)) +
          (roundTarget(mo) < mo.qty ? '<span class="calc">vòng ' + roundOf(mo) + ' · ' +
            nfmt(roundTarget(mo)) + '/' + nfmt(mo.qty) + '</span>' : '') + '</td>' +
          '<td class="n" data-live="mowait:' + mo.id + '">' + tgCho + '</td>' +
          '<td class="n" data-live="moact:' + mo.id + '">' + tgThuc + '</td>' +
          '<td>' + st + '</td>' +
          '<td data-live="motime:' + mo.id + '">' + timeCell(mo) + '</td>' +
          '<td data-live="moqty:' + mo.id + '">' + qtyCell(mo) + '</td>' +
          '<td class="acts">' + acts + '</td></tr>' + holdForm;
      }
      const table = mosWithRuns.length
        ? '<div class="tscroll"><table><thead><tr><th>MO</th><th>Tên con hàng</th><th>Số lượng</th><th>Line</th>' +
        '<th>TG yêu cầu</th><th>TG chờ</th><th>TG thực tế</th><th>Hiện trạng Line</th>' +
        '<th>Kết quả thời gian</th><th>Sản lượng</th><th></th>' +
        '</tr></thead><tbody>' + mosWithRuns.map(moAggregatedRow).join('') + '</tbody></table></div>'
        : '<p class="empty">Chưa có line nào được thêm vào bảng.</p>';

      // Đóng thùng tách riêng trong Step4
      const packingMos = h.filter(mo => runsOf(mo).length);
      const packingRows = packingMos.map(mo => {
        const pk = mo.packing;
        const isRunning = runsOf(mo).some(r => r.status === 'RUN' || r.status === 'DONE');
        const isPackForm = S.ui.packFinish === mo.id;
        const sxDoneForPack = !!mo.steps[4]?.completedAt;
        const linesTxt = lineList(runsOf(mo));
        let packBlock;
        if (!pk.startedAt) {
          packBlock = isRunning
            ? '<div class="acts nowrap"><button class="btn primary sm" data-act="pack-start" data-mo="' + mo.id + '">Bắt đầu đóng thùng</button><span class="pill">song song với SX</span></div>'
            : '<div class="acts nowrap"><span class="pill">Chờ SX Đang lắp ráp mới được đóng thùng</span></div>';
        } else if (!pk.completedAt) {
          if (isPackForm) {
            packBlock = sxDoneForPack
              ? '<div class="inline-form" style="align-items:flex-start"><span class="lb">SL đã đóng thùng</span><input type="number" class="num-in" id="packqty-' + mo.id + '" value="' + sxOkOf(mo) + '" min="1" max="' + sxOkOf(mo) + '"><span class="lb">SX đạt ' + nfmt(sxOkOf(mo)) + (hourlySum(mo) ? ' · Σ giờ ' + nfmt(hourlySum(mo)) : '') +
                (quyCach(mo) ? ' · ' + moTaThung(sxOkOf(mo), quyCach(mo)) : '') + '</span><span class="lb">Lý do</span><input type="text" id="packreason-' + mo.id + '" value="Đủ" placeholder="bắt buộc" style="flex:1;min-width:170px"><button class="btn good sm" data-act="pack-finish-ok" data-mo="' + mo.id + '">Xác nhận</button><button class="btn ghost sm" data-act="pack-finish-cancel" data-mo="' + mo.id + '">Hủy</button></div>'
              : '<div class="acts nowrap"><span class="pill warn">Chờ Hoàn thành (đồng bộ) SX mới được kết thúc đóng thùng</span><button class="btn ghost sm" disabled title="Phải Hoàn thành SX trước">Kết thúc đóng thùng</button></div>';
          } else {
            packBlock = '<div class="acts nowrap"><span class="pill acc pack-timer">Đang đóng thùng <b data-live="pack:' + mo.id + '">' + dur(now() - pk.startedAt) + '</b> · ' + esc(pk.by) + '</span><button class="btn good sm" data-act="pack-finish-open" data-mo="' + mo.id + '"' + (sxDoneForPack ? '' : ' disabled title="Phải Hoàn thành SX trước"') + '>Kết thúc đóng thùng</button></div>';
          }
        } else {
          const duoi = mo.steps[4]?.completedAt ? Math.max(0, pk.completedAt - mo.steps[4].completedAt) : null;
          packBlock = '<div class="acts"><span class="pill ok">Đóng thùng xong ' + dur(pk.completedAt - pk.startedAt) + ' · ' + nfmt(pk.qtyPacked) + ' PCS</span>' +
            ((mo.sx && mo.sx.qtyNg) ? '<span class="pill bad">SX hỏng ' + nfmt(mo.sx.qtyNg) + '</span>' : '') +
            (duoi != null ? '<span class="pill warn">Đuôi sau SX ' + dur(duoi) + '</span>' : '') +
            '<span class="calc">' + esc(pk.packingReason || '') + '</span></div>';
        }
        const sxDone = !!mo.steps[4]?.completedAt;
        return '<div class="row live">' + head(mo) + meta(mo, '<span>Line <b>' + esc(linesTxt) + '</b></span><span>SX <b data-live="step:' + mo.id + ':4">' + (sxDone ? dur(mo.steps[4].completedAt - mo.steps[4].acceptedAt) : dur(stepElapsed(mo, 4))) + '</b></span>' + (pk.startedAt ? '<span>Đóng thùng <b data-live="pack:' + mo.id + '">' + dur((pk.completedAt || now()) - pk.startedAt) + '</b></span>' : '')) + packBlock + '</div>';
      }).join('');
      const packingPanel = '<div class="cols"><section class="panel" style="margin-top:16px"><header><h2>Đóng thùng (song song) — trong Step4</h2><span class="meta">' + packingMos.length + ' MO</span></header><div class="body">' + (packingRows || '<p class="empty">Chưa có MO nào để đóng thùng — cần Đang lắp ráp trước.</p>') + '<p class="note">Tách riêng khỏi chọn line để tránh nhầm. <u>Bắt đầu</u> khi Đang lắp ráp, <u>Kết thúc</u> phải sau <u>Hoàn thành (đồng bộ)</u>. SL hỏng ghi ở bước Sản xuất, nên ở đây chỉ đếm số đã đóng và không được vượt SL đạt của SX.</p></div></section></div>';

      // hourly panel - chỉ hiện khi đang tiến hành
      const runningMos = h.filter(m => runsOf(m).some(r => r.status === 'RUN'));
      /* Đủ 24 khung, xếp vòng bắt đầu 06:00 cho hợp ca xưởng — ca đêm vẫn ghi được */
      const gioHienTai = new Date(now()).getHours();
      const hourOpts = Array.from({ length: 24 }, (_, i) => {
        const hh = (6 + i) % 24;
        const s = String(hh).padStart(2, '0') + ':00-' + String((hh + 1) % 24).padStart(2, '0') + ':00';
        return '<option value="' + s + '"' + (gioHienTai === hh ? ' selected' : '') + '>' + s + '</option>';
      }).join('');
      const moOpts = runningMos.map(m => '<option value="' + m.id + '">' + esc(m.code) + ' - ' + esc(m.product) + '</option>').join('') || '<option value="">— chưa có MO đang tiến hành —</option>';

      /* ══ Đóng thùng theo giờ ═══════════════════════════════════
         PHẢI đặt sau `hourOpts` / `moOpts` — khối này dùng lại `hourOpts`, mà nó
         khai bằng `const` nên đọc trước lúc khai là ReferenceError (TDZ), và
         `render()` chết giữa chừng: màn hình đứng ở lần vẽ trước, bấm nút nào
         cũng tưởng không ăn.
         Song song với panel Sản lượng theo giờ, nhưng đơn vị khác: bên kia đếm PCS
         làm ra, bên này đếm THÙNG đóng được. Dòng `lẻ trên bàn` là thứ quan trọng
         nhất ở đây — nó cho thấy phần chênh giữa hai sổ KHÔNG phải hàng thiếu. */
      const packingNow = h.filter(m => m.packing?.startedAt && !m.packing.completedAt && quyCach(m) > 0);
      const packMoOpts = packingNow.map(m =>
        '<option value="' + m.id + '">' + esc(m.code) + ' - ' + esc(m.product) +
        ' (' + nfmt(quyCach(m)) + ' pcs/thùng)</option>').join('');
      const packHourRows = (S.packHourly || [])
        .filter(x => h.some(m => m.id === x.moId && (x.round || 1) === roundOf(m)))
        .slice(-30)
        .map(x => '<tr><td class="n">' + esc(x.day || '—') + '</td><td class="n">' + esc(x.slot) + '</td>' +
          '<td class="c">' + esc(x.moCode) + '</td><td class="n">' + x.boxes + '</td>' +
          '<td class="n">' + nfmt(x.pcsPerBox) + '</td><td class="n">' + nfmt(x.boxes * x.pcsPerBox) + '</td>' +
          '<td>' + esc(x.note || '') + '</td><td class="n">' + hhmm(x.at) + '</td><td>' + esc(x.by) + '</td></tr>').join('');
      const packHourTable = packHourRows
        ? '<div class="tscroll"><table><thead><tr><th>Ngày</th><th>Giờ</th><th>MO</th><th>Số thùng</th>' +
          '<th>Quy cách</th><th>= pcs</th><th>Ghi chú</th><th>Ghi lúc</th><th>Người ghi</th></tr></thead><tbody>' +
          packHourRows + '</tbody></table></div>'
        : '<p class="empty">Chưa ghi thùng nào.</p>';
      const packTinhTrang = packingNow.map(m => {
        const le = leTrenBan(m);
        return '<div class="calc"><b>' + esc(m.code) + '</b> — đã đóng <b>' + thungGioSum(m) + ' thùng</b> = ' +
          nfmt(daDongPcs(m)) + ' pcs · làm ra ' + nfmt(laRaPcs(m)) + ' pcs · ' +
          (le
            ? '<span style="color:var(--warn)">lẻ trên bàn <b>' + nfmt(le) + '</b> — chờ gom, KHÔNG phải hàng thiếu</span>'
            : '<span style="color:var(--ok)">không còn hàng lẻ</span>') + '</div>';
      }).join('');
      const packHourForm = packingNow.length
        ? '<div class="inline-form"><span class="lb">MO</span><select id="pbox-mo">' + packMoOpts + '</select>' +
          '<span class="lb">Khung giờ</span><select id="pbox-slot">' + hourOpts + '</select>' +
          '<span class="lb">Số thùng ĐẦY</span><input type="number" class="num-in" id="pbox-n" placeholder="1" min="1" step="1">' +
          '<span class="lb">Ghi chú</span><input type="text" id="pbox-note" placeholder="hết băng keo..." style="flex:1;min-width:140px">' +
          '<button class="btn primary sm" data-act="pbox-add">Ghi</button></div>'
        : '<p class="empty">Chỉ hiện khi có MO <b>đang đóng thùng</b> và đã khai <b>quy cách</b> (pcs/thùng).</p>';
      const packHourlyPanel = '<div class="cols"><section class="panel" style="margin-top:16px">' +
        '<header><h2>Đóng thùng theo giờ</h2><span class="meta">' + packingNow.length + ' MO</span></header>' +
        '<div class="body">' + packHourForm + packTinhTrang + packHourTable +
        '<p class="note">Mỗi giờ chỉ đếm <b>thùng ĐẦY</b>. Hàng chưa đủ một thùng để nguyên trên bàn — ' +
        '<u>đó không phải hàng thiếu</u>, giờ sau gom tiếp. ' +
        '<b>Thùng cuối của đơn được đóng thiếu</b>, nên phần lẻ cuối cùng vẫn nhập kho được và đơn vẫn đóng đủ. ' +
        'Tiến độ MO luôn tính bằng <b>PCS</b> — thùng chỉ là cách đếm cho nhanh (§7b.2).</p></div></section></div>';
      const hourlyRows = (S.hourly || []).filter(hr => h.some(m => m.id === hr.moId && (hr.round || 1) === roundOf(m))).slice(-30).map(hr => '<tr><td class="n">' + esc(hr.day || '—') + '</td><td class="n">' + esc(hr.slot) + '</td><td class="c">' + esc(hr.moCode) + '</td><td class="n">' + (hr.people || '—') + '</td><td class="n">' + (hr.target ? nfmt(hr.target) : '—') + '</td><td class="n">' + nfmt(hr.qty) + '</td><td class="n">' + datPct(hr.target, hr.qty) + '</td><td class="n">' + nangSuat(hr.people, hr.qty) + '</td><td>' + esc(hr.note || '') + '</td><td class="n">' + hhmm(hr.at) + '</td><td>' + esc(hr.by) + '</td></tr>').join('');
      const hourlyTable = hourlyRows ? '<div class="tscroll"><table><thead><tr><th>Ngày</th><th>Giờ</th><th>MO</th><th>Số người</th><th>SL yêu cầu</th><th>SL thực tế</th><th>Đạt</th><th>Năng suất</th><th>Ghi chú</th><th>Ghi lúc</th><th>Người ghi</th></tr></thead><tbody>' + hourlyRows + '</tbody></table></div>' : '<p class="empty">Chưa ghi sản lượng giờ nào.</p>';
      const hourlyForm = runningMos.length
        ? '<div class="inline-form"><span class="lb">MO</span><select id="hour-mo">' + moOpts + '</select><span class="lb">Khung giờ</span><select id="hour-slot">' + hourOpts + '</select><span class="lb">Số người</span><input type="number" class="num-in" id="hour-people" placeholder="12" min="1" step="1"><span class="lb">Sản lượng yêu cầu</span><input type="number" class="num-in" id="hour-target" placeholder="600" min="1"><span class="lb">Sản lượng thực tế</span><input type="number" class="num-in" id="hour-qty" placeholder="500" min="1"><span class="lb">Ghi chú</span><input type="text" id="hour-note" placeholder="ca đêm, máy chậm..." style="flex:1;min-width:140px"><button class="btn primary sm" data-act="hour-add">Ghi</button></div>'
        : '<p class="empty">Chỉ khi <b>Đang lắp ráp</b> mới được ghi sản lượng giờ.</p>';
      const hourlyPanel = '<div class="cols"><section class="panel" style="margin-top:16px"><header><h2>Sản lượng theo giờ (theo MO)</h2><span class="meta">Chỉ hiện khi Đang lắp ráp</span></header>' +
        '<div class="body">' + hourlyForm + hourlyTable + '<p class="note">Mỗi khung giờ ghi <b>ba số</b>: số người đứng chuyền, sản lượng <u>yêu cầu</u> và sản lượng <u>thực tế</u>. ' +
        'Từ đó ra <b>Đạt %</b> (thực tế / yêu cầu) và <b>Năng suất</b> (thực tế / số người) — một mình con số thực tế không nói được nhanh hay chậm. ' +
        'Ghi <u>theo MO</u>, không theo line — vd L03 chạy 2 MO thì chọn MO để ghi 500 cho MO đó. Slot 8h-9h, 9h-10h ... theo giờ xưởng. Chỉ khi trạng thái <b>Đang lắp ráp</b> mới được hiện và nhập.</p></div></section></div>';

      return '<div class="cols two">' +
        '<section class="panel"><header><h2>Chọn line</h2><span class="meta">' + h.length +
        ' MO · ' + LINES + ' line</span></header>' +
        '<div class="body">' + (h.length ? h.map(linePicker).join('') : '<p class="empty">Chưa Accept MO nào.</p>') +
        '<p class="note">Accept xong thì tick các line muốn chạy (chọn nhiều cùng lúc) rồi <u>Thêm line vào bảng</u> — 1 MO gộp 1 dòng, cột Line hiển thị <u>L01, L02</u>, không chia SL theo line. §14B một line nhận nhiều MO. §16 tất cả line của một MO <u>đóng cùng một mốc giờ</u>.</p></div></section>' +
        '<section class="panel"><header><h2>Hàng đợi từ Bàn team leader</h2><span class="meta">' + q.length + ' MO</span></header>' +
        '<div class="body">' +
        hopQuet(4, 'Quét QR để Line Leader nhận — Bàn team leader tự đóng. Nhận xong mới chọn được line.') +
        (qr || '<p class="empty">Không có MO nào chờ.</p>') + '</div></section></div>' +
        '<div class="cols"><section class="panel" style="margin-top:16px"><header><h2>Bảng đang chạy</h2>' +
        '<span class="meta">§7.2 · 11B · 12B</span></header><div class="body flush">' + table + '</div>' +
        '<div class="body"><p class="note">Line mới thêm vào ở trạng thái <u>Chờ xử lý</u> và bắt đầu chạy ' +
        '<u>TG chờ</u>. Bấm <u>Đang lắp ráp</u> thì TG chờ dừng, <u>TG thực tế</u> bắt đầu đếm. Bấm <u>Dừng</u> thì line quay lại Chờ xử lý — TG thực tế đứng lại, TG chờ chạy tiếp. ' +
        'Hai cột kết quả tách riêng vì trả lời hai câu khác nhau: <u>Kết quả thời gian</u> chạy live ' +
        '(Đạt / Quá giờ bao nhiêu), <u>Sản lượng</u> chỉ có sau khi chốt sổ Sản xuất — hiện <u>SL đạt trên mục tiêu vòng</u>, ' +
        'tách rõ hỏng bao nhiêu · thiếu bao nhiêu · phải bù bao nhiêu ở vòng sau. ' +
        'Line đang hỏng máy hiện badge đỏ <u>ĐANG DỪNG</u> kèm lý do để phân biệt với line chưa chạy.</p>' +
        '</div></section></div>' + hourlyPanel + packingPanel + packHourlyPanel;
    }

    /* Tổng thời gian MO đã nằm ở một bước, CỘNG DỒN QUA MỌI VÒNG.
       Trước đây bảng chỉ đọc mo.steps — tức vòng hiện tại — nên MO đi qua Setup ba
       lần vẫn hiện "—" nếu vòng cuối không qua Setup. Nhìn vào tưởng chưa từng setup.
       Trả về { ms, soVong, dangChay } để hiện thêm "n vòng" khi có nhiều lần. */
    function stepTong(mo, n) {
      let ms = 0, soVong = 0, dangChay = false;
      (mo.stepsHistory || []).forEach(v => {
        const st = (v.steps || {})[n];
        if (!st || !st.acceptedAt) return;
        soVong++;
        if (st.completedAt) ms += st.completedAt - st.acceptedAt;
      });
      const cur = mo.steps[n];
      if (cur && cur.acceptedAt) {
        soVong++;
        ms += (cur.completedAt || now()) - cur.acceptedAt;
        if (!cur.completedAt) dangChay = true;
      }
      return soVong ? { ms: ms, soVong: soVong, dangChay: dangChay } : null;
    }

    /* Một bảng "Đi qua các bước" cho MỘT vòng — cùng đúng định dạng dùng cho vòng
       đang chạy, chỉ khác nguồn dữ liệu. Vòng cũ lấy từ stepsHistory, vòng đang chạy
       lấy thẳng từ mo. Nhờ vậy xem lại vòng 1 cũng biết ai nhận, ai đóng, mất bao lâu. */
    function bangMotVong(mo, v) {
      const line = [];
      if (v.khoAcceptedAt) line.push({
        st: '0 · Kho', by: ACTOR[0], acc: v.khoAcceptedAt, close: v.handedOverAt,
        note: 'bàn giao ' + (v.handedOverAt ? hhmm(v.handedOverAt) : 'chưa')
      });
      [1, 2, 3, 4, 5].forEach(n => {
        const st = (v.steps || {})[n]; if (!st || !st.acceptedAt) return;
        line.push({
          buoc: n,
          st: n + ' · ' + STEP_NM[n], by: st.by || ACTOR[n], acc: st.acceptedAt, close: st.completedAt,
          note: n < 5 ? 'đóng khi ' + STEP_NM[n + 1] + ' Accept' : 'đóng bằng nút Hoàn thành',
          closedBy: n < 5 ? ACTOR[n + 1] : ACTOR[5]
        });
      });
      if (v.pack && v.pack.startedAt) line.push({
        st: '4b · Đóng thùng (song song)', by: v.pack.by || ACTOR_PACK,
        acc: v.pack.startedAt, close: v.pack.completedAt,
        note: 'chạy // SX, Kết thúc SX và Kết thúc đóng thùng riêng', closedBy: '—'
      });

      /* Riêng dòng Sản xuất bấm được: bên trong nó còn mấy line chạy song song,
         line nào dừng vì gì, mỗi giờ ra bao nhiêu cái. Để bung sẵn thì bảng dài
         gấp đôi dù phần lớn lúc người ta chỉ xem giờ giấc các bước. */
      const khoaSX = mo.id + ':' + v.round;
      const moSX = S.ui.sxTrace === khoaSX;
      const rows = line.map(x => {
        const laSX = x.buoc === 4;
        const tr = '<tr' + (laSX ? ' class="clickable' + (moSX ? ' open' : '') +
            '" data-act="sx-trace" data-mo="' + mo.id + '" data-round="' + v.round + '"' : '') +
          '><td class="c">' + esc(x.st) +
          (laSX ? '<span class="calc acc">' + (moSX ? '▾ đang mở' : '▸ bấm xem năng suất & sản lượng') +
            '</span>' : '') + '</td>' +
          '<td>' + esc(x.by) + '</td>' +
          '<td class="n">' + hhmm(x.acc) + '</td>' +
          '<td class="n">' + (x.close ? hhmm(x.close) : '—') + '</td>' +
          '<td class="n">' + dur((x.close == null ? now() : x.close) - x.acc) + '</td>' +
          '<td>' + (x.closedBy ? esc(x.closedBy) : '—') +
          '<span class="calc">' + esc(x.note) + '</span></td></tr>';
        return tr + (laSX && moSX
          ? '<tr><td class="detail sub2" colspan="6">' + khoiSanXuat(mo, v) + '</td></tr>' : '');
      }).join('');

      return '<h3>Đi qua các bước — Vòng ' + v.round +
        (v.live ? (mo.status === 'COMPLETED' ? ' (vòng cuối)' : ' (đang chạy)') : '') + '</h3>' +
        '<div class="tscroll"><table class="sub"><thead><tr>' +
        '<th>Bước</th><th>Người Accept</th><th>Accept lúc</th><th>Đóng lúc</th>' +
        '<th>Thời lượng</th><th>Đóng bởi</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="6" class="empty">Chưa vào bước nào.</td></tr>') +
        '</tbody></table></div>';
    }

    /* Bước Sản xuất là bước duy nhất có nhiều thứ xảy ra bên trong: mấy line chạy,
       line nào dừng vì gì, mỗi giờ ra bao nhiêu cái. Nhét hết vào một dòng "4 · Sản xuất"
       thì mất sạch; nên bung ra ngay dưới bảng bước của chính vòng đó. */
    function khoiSanXuat(mo, v) {
      const runs = (mo.runs || []).filter(r => (r.round || 1) === v.round)
        .sort((a, b) => a.line - b.line);
      const hrs = (S.hourly || []).filter(x => x.moId === mo.id && (x.round || 1) === v.round)
        .sort((a, b) => a.at - b.at);
      if (!runs.length && !hrs.length) return '';

      const TT = { WAIT: 'Chờ xử lý', RUN: 'Đang lắp ráp', DONE: 'Hoàn thành' };
      const lineRows = runs.map(r => {
        const k = runKpi(r);
        return '<tr><td class="c">L' + String(r.line).padStart(2, '0') + '</td>' +
          '<td class="n">' + dur(waitMs(r)) + '</td>' +
          '<td class="n">' + dur(actualMs(r)) + '</td>' +
          '<td class="n">' + (k ? dur(k.req) : '—') + '</td>' +
          '<td>' + (k
            ? '<span class="pill ' + (k.ok ? 'ok' : 'bad') + '">' + (k.ok ? 'Đạt' : 'Quá giờ') + '</span>' +
              (k.late ? '<span class="calc late">trễ ' + dur(k.late) + '</span>' : '')
            : '<span class="pill">chưa chạy</span>') + '</td>' +
          '<td>' + (TT[r.status] || r.status) +
          (r.holdReason ? '<span class="calc late">' + esc(r.holdReason) + '</span>' : '') +
          '</td></tr>';
      }).join('');

      const bangLine = !runs.length ? '' :
        '<div class="tscroll"><table class="sub"><thead><tr><th>Line</th><th>TG chờ</th>' +
        '<th>TG thực tế</th><th>Hạn mức vòng</th><th>Kết quả thời gian</th><th>Trạng thái</th>' +
        '</tr></thead><tbody>' + lineRows + '</tbody></table></div>' +
        '<p class="note">Hạn mức là thời gian yêu cầu của cả MO <b>chia theo SL của vòng này</b>. ' +
        'KPI của vòng lấy line <u>chạy lâu nhất</u> (§21A).</p>';

      const sxOk = v.live ? (mo.sx?.qtyOk) : v.sxOk;
      const tongGio = hrs.reduce((a, x) => a + x.qty, 0);
      const tongYeuCau = hrs.reduce((a, x) => a + (x.target || 0), 0);
      const doiSoat = sxOk == null
        ? '<span style="color:var(--ink-3)">Chưa chốt sổ SX nên chưa đối soát được</span>'
        : tongGio === sxOk
          ? '<span style="color:var(--ok)">Khớp với SL đạt của vòng (' + nfmt(sxOk) + ')</span>'
          : tongGio < sxOk
            ? '<span style="color:var(--warn)">Mới ghi <b>' + nfmt(tongGio) + '</b> / SX đạt <b>' +
              nfmt(sxOk) + '</b></span><span class="calc">còn ' + nfmt(sxOk - tongGio) +
              ' làm ra nhưng chưa ghi khung giờ nào</span>'
            : '<span style="color:var(--bad)">Ghi giờ <b>' + nfmt(tongGio) +
              '</b> nhiều hơn SX đạt <b>' + nfmt(sxOk) + '</b></span>' +
              '<span class="calc late">dư ' + nfmt(tongGio - sxOk) + ' — cần rà lại</span>';

      const bangGio = !hrs.length ? '' :
        '<div class="tscroll"><table class="sub"><thead><tr><th>Ngày</th><th>Khung giờ</th>' +
        '<th>Số người</th><th>SL yêu cầu</th><th>SL thực tế</th><th>Đạt</th><th>Năng suất</th>' +
        '<th>Ghi chú</th><th>Ghi lúc</th><th>Người ghi</th></tr></thead><tbody>' +
        hrs.map(x => '<tr><td class="n">' + esc(x.day || '—') + '</td>' +
          '<td class="n">' + esc(x.slot) + '</td>' +
          '<td class="n">' + (x.people || '—') + '</td>' +
          '<td class="n">' + (x.target ? nfmt(x.target) : '—') + '</td>' +
          '<td class="n">' + nfmt(x.qty) + '</td>' +
          '<td class="n">' + datPct(x.target, x.qty) + '</td>' +
          '<td class="n">' + nangSuat(x.people, x.qty) + '</td>' +
          '<td>' + esc(x.note || '') + '</td>' +
          '<td class="n">' + hhmm(x.at) + '</td>' +
          '<td>' + esc(x.by) + '</td></tr>').join('') +
        '<tr class="sum"><td class="c"><b>Tổng</b></td><td></td><td></td>' +
        '<td class="n"><b>' + (tongYeuCau ? nfmt(tongYeuCau) : '—') + '</b></td>' +
        '<td class="n"><b>' + nfmt(tongGio) + '</b></td>' +
        '<td class="n"><b>' + datPct(tongYeuCau, tongGio) + '</b></td><td></td>' +
        '<td colspan="3">' + doiSoat + '</td></tr></tbody></table></div>';

      if (!bangLine && !bangGio)
        return '<p class="empty">Vòng này chưa gán line, chưa ghi sản lượng giờ nào.</p>';
      return (bangLine ? '<h4>Năng suất từng line</h4>' + bangLine : '') +
        (bangGio ? '<h4>Sản lượng theo giờ</h4>' + bangGio : '');
    }

    /* Danh sách vòng để dựng bảng: các vòng đã chốt sổ, rồi tới vòng đang chạy. */
    function dsVongTrace(mo) {
      const pkCua = r => (mo.packingHistory || []).find(x => x.round === r);
      const ds = (mo.stepsHistory || []).map(v => ({
        round: v.round, steps: v.steps || {}, pack: pkCua(v.round),
        khoAcceptedAt: v.khoAcceptedAt, handedOverAt: v.handedOverAt, live: false
      }));
      if (mo.status !== 'COMPLETED' || !ds.length)
        ds.push({
          round: roundOf(mo), steps: mo.steps, pack: mo.packing,
          khoAcceptedAt: mo.kho.acceptedAt, handedOverAt: mo.kho.handedOverAt, live: true
        });
      return ds;
    }

    /* ── Lịch sử & KPI ── */
    /* Nhật ký truy cứu của một MO: ai Accept ở bước nào, lúc mấy giờ.
       Vì không có nút Complete, bước N đóng do người bước N+1 Accept — cột "Đóng bởi"
       ghi lại đúng người đó, sau này gắn phân quyền là truy được trách nhiệm. */
    function moTrace(mo) {
      const hs = S.history.filter(h => h.mo === mo.code);
      const logs = hs.map(h => '<tr><td class="n">' + hhmm(h.at) + '</td>' +
        '<td>' + esc(h.user) + '</td><td class="c">' + esc(h.action) + '</td>' +
        '<td>' + (h.from || h.to ? esc(h.from) + ' → ' + esc(h.to) : '') +
        (h.reason ? '<span class="calc">' + esc(h.reason) + '</span>' : '') + '</td></tr>').join('');

      const rework = hs.some(h => h.action === 'QC_FAIL');

      /* Bảng này trước chỉ liệt kê vòng ĐÃ đóng sổ, nên trong cửa sổ
         "đã chốt sổ SX → chưa nhập kho" bấm truy cứu không thấy dòng nào —
         đúng lúc người ta cần xem hỏng/thiếu vừa khai. Nối thêm vòng đang chạy,
         các ô điền dần theo tiến độ, đánh dấu rõ là số chưa chốt. */
      const daChot = mo.stepsHistory || [];
      const coSoLieu = mo.sx?.qtyOk != null || mo.packing?.qtyPacked != null;
      const vongLive = (mo.status !== 'COMPLETED' && (daChot.length || coSoLieu))
        ? [{
          round: roundOf(mo), steps: mo.steps, khoAcceptedAt: mo.kho.acceptedAt,
          batDauTu: mo.veDau == null ? 0 : mo.veDau,
          qtyPacked: mo.packing?.qtyPacked,
          sxOk: mo.sx?.qtyOk != null ? mo.sx.qtyOk : null,
          qtyNg: mo.sx?.qtyNg || 0, sxShort: mo.sx?.qtyShort || 0,
          sxNgReason: mo.sx?.ngReason || '', sxShortReason: mo.sx?.shortReason || '',
          packingReason: mo.packing?.packingReason || '', reason: '', dangChay: true
        }]
        : [];
      const vongCu = daChot.concat(vongLive).map(v => {
        /* Đọc THẲNG nơi vòng đó bắt đầu, không suy từ các bước đã đi.
           Suy thì vòng vừa mở — chưa nhận bước nào — luôn bị đoán nhầm thành
           "Bàn team leader", kể cả khi nó vừa bị QC FAIL trả về Kho. Dữ liệu cũ chưa có
           ô này thì mới suy tạm như trước. */
        const st = v.steps || {};
        const bd = v.batDauTu != null ? v.batDauTu
                 : (st[1] && st[1].acceptedAt ? 0 : 3);
        const batDau = bd === 3
          ? { ten: 'Bàn team leader', luc: st[3] && st[3].acceptedAt }
          : { ten: 'Kho', luc: v.khoAcceptedAt };
        const mocCuoi = st[5] && st[5].completedAt;
        return '<tr' + (v.dangChay ? ' class="live"' : '') + '><td class="c">Vòng ' + v.round +
          (v.dangChay ? '<span class="pill acc">đang chạy</span>' : '') + '</td>' +
          '<td class="bd">' + esc(batDau.ten) +
          (batDau.luc ? '<span class="calc">' + hhmm(batDau.luc) + '</span>' : '') + '</td>' +
          '<td class="n">' + (mocCuoi ? hhmm(mocCuoi) : '—') + '</td>' +
          /* Số ở cột số, chữ ở cột chữ — nhét lý do xuống dưới con số thì
             cột số hết đọc lướt được, mà lý do cũng bị co nhỏ khó đọc. */
          '<td class="n">' + (v.sxOk != null ? nfmt(v.sxOk) : '—') + '</td>' +
          '<td class="n">' + (v.qtyNg ? nfmt(v.qtyNg) : '—') + '</td>' +
          '<td class="n">' + (v.sxShort ? nfmt(v.sxShort) : '—') + '</td>' +
          '<td class="n">' + nfmt(v.qtyPacked) + '</td>' +
          '<td>' + (v.sxNgReason ? esc(v.sxNgReason) : '—') + '</td>' +
          '<td>' + (v.sxShortReason ? esc(v.sxShortReason) : '—') + '</td>' +
          '<td>' + (v.packingReason ? esc(v.packingReason) : '—') + '</td>' +
          '<td>' + (v.dangChay
            ? '<span class="calc">vòng chưa chốt sổ — số còn thay đổi</span>'
            : esc(v.reason)) + '</td></tr>';
      }).join('');

      return (vongCu
        ? '<h3>Các vòng · hiện đang ở vòng ' + roundOf(mo) + '</h3><div class="tscroll">' +
        '<table class="sub"><thead><tr><th>Vòng</th><th>Bắt đầu từ</th><th>Nhập kho xong</th>' +
        '<th>SX đạt</th><th>SL hỏng</th><th>SL thiếu</th><th>Đã đóng thùng</th>' +
        '<th>Lý do hỏng</th><th>Lý do thiếu</th><th>ghi chú đóng thùng</th><th>Lý do trả lại</th>' +
        '</tr></thead><tbody>' + vongCu + '</tbody></table></div>'
        : '') +
        dsVongTrace(mo).map(v => bangMotVong(mo, v)).join('') +
        (rework ? '<p class="note">MO này đã QC FAIL và chạy lại. Bảng <u>Timer từng bước</u> ở trên ' +
          '<b>cộng dồn thời gian qua mọi vòng</b> và ghi rõ đi qua mấy vòng; bảng ngay đây chỉ là ' +
          '<b>vòng đang chạy</b>. Muốn xem riêng từng vòng thì nhìn bảng <u>Các vòng</u> phía trên.</p>' : '') +
        '<h3>Nhật ký đầy đủ · ' + hs.length + ' bản ghi</h3><div class="tscroll"><table class="sub"><thead><tr>' +
        '<th>Giờ</th><th>Người</th><th>Hành động</th><th>Chuyển trạng thái / lý do</th>' +
        '</tr></thead><tbody>' + logs + '</tbody></table></div>';
    }
    function viewKpi() {
      const done = S.mos.filter(m => m.status === 'COMPLETED');
      const okN = done.filter(m => { const k = moKpi(m); return k && k.ok; }).length;
      const lateN = done.filter(m => { const k = moKpi(m); return k && k.late > 0; }).length;
      const wip = S.mos.filter(m => m.status === 'PROCESSING').length;
      const rework = S.mos.filter(m => (m.qc && m.qc.result === 'FAIL') ||
        (m.qcHistory || []).some(q => q.result === 'FAIL')).length;

      const tiles = '<div class="tiles">' +
        '<div class="tile"><span class="k">Đang chạy</span><span class="v">' + wip + '</span><span class="s">MO trong chuyền</span></div>' +
        '<div class="tile"><span class="k">Completed</span><span class="v">' + done.length + '</span><span class="s">đã nhập kho</span></div>' +
        '<div class="tile ' + (!done.length ? '' : okN === done.length ? 'ok' : 'bad') + '"><span class="k">Đạt thời gian</span>' +
        '<span class="v">' + okN + '/' + done.length + '</span><span class="s">§21A — lấy line chạy lâu nhất</span></div>' +
        '<div class="tile ' + (lateN ? 'warn' : '') + '"><span class="k">Quá giờ</span>' +
        '<span class="v">' + lateN + '/' + done.length + '</span><span class="s">vượt thời gian yêu cầu</span></div>' +
        '<div class="tile ' + (rework ? 'warn' : '') + '"><span class="k">QC Fail</span><span class="v">' + rework + '</span>' +
        '<span class="s">đã quay về Kho</span></div>' +
        '<div class="tile ' + (S.mos.some(m => ngTotal(m)) ? 'warn' : '') + '"><span class="k">SL hỏng</span>' +
        '<span class="v">' + nfmt(S.mos.reduce((a, m) => a + ngTotal(m), 0)) + '</span>' +
        '<span class="s">phải làm bù ở vòng sau</span></div>' +
        '<div class="tile"><span class="k">Đã hủy</span><span class="v">' + S.mos.filter(m => m.status === 'CANCELLED').length +
        '</span><span class="s">§4A — không hard delete</span></div>' +
        '</div>';

      const rows = S.mos.filter(m => m.step != null && m.status !== 'DRAFT').map(mo => {
        const cells = [1, 2, 3, 4, 5].map(n => {
          const t = stepTong(mo, n);
          if (!t) return '<td class="n">—</td>';
          return '<td class="n' + (t.dangChay ? ' running' : '') + '"' +
            (t.dangChay ? ' data-live="steptong:' + mo.id + ':' + n + '"' : '') + '>' + dur(t.ms) +
            (t.soVong > 1 ? '<span class="calc">' + t.soVong + ' vòng</span>' : '') + '</td>';
        }).join('');
        // cột Đóng thùng song song (không phải step) — nếu đang ở Kho vòng mới thì hiện lịch sử vòng trước
        const pk = mo.packing;
        const pkHist = (!pk.startedAt && mo.packingHistory && mo.packingHistory.length) ? mo.packingHistory[mo.packingHistory.length - 1] : null;
        const pkShow = pk.startedAt ? pk : pkHist;
        const pkCell = !pkShow || !pkShow.startedAt ? '<td class="n">—</td>' : '<td class="n' + (!pkShow.completedAt ? ' running' : '') + '"' + (!pkShow.completedAt ? ' data-live="pack:' + mo.id + '"' : '') + '>' + dur((pkShow.completedAt || now()) - pkShow.startedAt) + '</td>';
        const k = moKpi(mo), open = S.ui.detail === mo.id;
        /* Cộng dồn qua các vòng: vòng 2 đóng nốt 1.000 của MO 10.000 là ĐÃ XONG,
           không được so lẻ 1.000 < 10.000 rồi báo chưa hoàn thành. */
        /* Hai cột tách riêng — KPI là chuyện THỜI GIAN, tiến độ là chuyện SỐ LƯỢNG.
           Gộp chung thì chữ "Đạt" bị đọc thành "xong đơn rồi" trong khi MO còn thiếu hàng,
           và ngược lại khi thiếu hàng thì mất luôn kết quả thời gian. */
        const tongDaXong = (mo.qtyDone || 0) + (mo.packing?.qtyPacked || 0);
        const duSL = tongDaXong >= mo.qty;
        const kpi2 = k
          ? '<span class="pill ' + (k.ok ? 'ok' : 'bad') + '">' + (k.ok ? 'Đạt' : 'Quá giờ') + '</span>'
          : '<span class="pill">chưa chạy</span>';
        const sl2 = duSL
          ? '<span class="pill ok">Đủ ' + nfmt(mo.qty) + '</span>' +
          (mo.status !== 'COMPLETED' ? '<span class="calc">chờ bấm Hoàn thành ở Nhập kho</span>' : '')
          : '<span class="pill warn">Còn ' + nfmt(mo.qty - tongDaXong) + '</span>' +
          '<span class="calc">' + nfmt(tongDaXong) + '/' + nfmt(mo.qty) + '</span>';
        const late2 = k && k.late ? dur(k.late) : '—';
        return '<tr class="clickable' + (open ? ' open' : '') + '" data-act="mo-detail" data-mo="' + mo.id + '">' +
          '<td class="c">' + esc(mo.code) + '</td>' + cells + pkCell +
          '<td>' + sl2 + '</td>' +
          '<td>' + kpi2 + '</td>' +
          '<td class="n">' + late2 + '</td></tr>' +
          (open ? '<tr><td class="detail" colspan="10">' + moTrace(mo) + '</td></tr>' : '');
      }).join('');

      const showLog = !!S.ui.log;
      const logs = !showLog ? '' : S.history.slice(-300).map(h =>
        '<div class="logrow ' + esc(h.kind) + '"><span class="t">' + hhmm(h.at) + '</span>' +
        '<span class="u">' + esc(h.user) + '</span><span class="a">' + esc(h.action) + '</span>' +
        '<span class="d"><b class="mono">' + esc(h.mo) + '</b>' +
        (h.from || h.to ? ' · ' + esc(h.from) + ' → ' + esc(h.to) : '') +
        (h.reason ? ' · ' + esc(h.reason) : '') + '</span></div>').join('');

      return tiles +
        '<div class="cols"><section class="panel" style="margin-top:16px"><header><h2>Timer từng bước</h2>' +
        '<span class="meta">§9 — SX & Đóng thùng chạy song song, mỗi cái 1 timer riêng</span></header>' +
        '<div class="body flush"><div class="tscroll"><table><thead><tr><th>MO</th>' +
        [1, 2, 3, 4, 5].map(n => '<th>' + n + ' · ' + STEP_NM[n] + '</th>').join('') + '<th>Đóng thùng</th>' +
        '<th>Tiến độ SL</th><th>KPI thời gian</th><th>Trễ</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="9" class="empty">Chưa có dữ liệu.</td></tr>') + '</tbody></table></div></div>' +
        '<div class="body"><p class="note"><b>Bấm vào một dòng</b> để xem MO đó đi qua từng bước, ai Accept lúc mấy giờ và ai làm bước trước đóng lại. Số tô xanh là bước đang chạy. Mỗi bước một timer riêng, không dùng timer chung (§1). Con số này gộp cả ' +
        'thời gian làm việc lẫn thời gian nằm chờ người bước sau Accept — v2 không tách hai phần đó.</p></div></section></div>' +
        '<div class="cols"><section class="panel" style="margin-top:16px"><header><h2>Nhật ký toàn xưởng</h2>' +
        '<span class="meta">§25A — append-only, ' + S.history.length + ' bản ghi</span>' +
        '<button class="btn ghost sm" data-act="toggle-log">' + (showLog ? 'Thu gọn' : 'Mở') + '</button></header>' +
        (showLog
          ? '<div class="body flush"><div class="log">' + logs + '</div></div>'
          : '<div class="body"><p class="note">Nhật ký chéo toàn xưởng theo dòng thời gian — dùng khi cần soi cả ca, ' +
          'ví dụ nhiều line cùng dừng một lúc thì nhìn ra ngay là mất điện chứ không phải hỏng máy. ' +
          'Muốn tra <b>một đơn hàng cụ thể</b> thì bấm thẳng vào dòng của nó ở bảng phía trên — nhanh hơn.</p></div>') +
        '</section></div>';
    }

    /* ══ Vẽ ═════════════════════════════════════════════════ */
    /* Số MO ĐANG NẰM ở trạm — con số trên thanh trạm.
       Kho phải đếm cả lệnh ĐÃ nhận nhưng CHƯA bàn giao: hàng vẫn còn ở kho, vẫn cần
       người làm tiếp. Trước đây badge Kho chỉ đếm hàng đợi nên hiện 0 trong khi kho
       còn lệnh nằm đó. Hai nhóm không chồng nhau vì một bên là chưa nhận, một bên là đã nhận. */
    function soLenhTaiTram(n) {
      if (n === 0) return queue(0).length +
        S.mos.filter(m => m.kho.acceptedAt && !m.kho.handedOverAt && m.status === 'PROCESSING').length;
      return queue(n).length + atStep(n).length;
    }
    function rail() {
      return STATIONS.map(s => {
        let ct = '';
        if (typeof s.n === 'number') ct = String(soLenhTaiTram(s.n));
        else if (s.n === 'plan') ct = String(S.mos.filter(m => m.status === 'DRAFT').length);
        return '<button class="st" role="tab" data-tab="' + s.n + '" aria-selected="' + (String(S.tab) === String(s.n)) + '">' +
          '<span class="num">' + s.num + '</span><span class="nm">' + s.nm + '</span>' +
          (ct ? '<span class="ct">' + ct + '</span>' : '') + '</button>';
      }).join('');
    }
    /* Cho mỗi <th> lấy căn lề của ô dữ liệu cùng cột. Chạy sau mỗi lần vẽ nên
       bảng nào thêm sau này cũng tự khớp, không phải sửa tay từng cái. */
    function alignHeaders() {
      document.querySelectorAll('table').forEach(t => {
        const hr = t.tHead && t.tHead.rows[0];
        const tb = t.tBodies && t.tBodies[0];
        if (!hr || !tb) return;
        const br = Array.from(tb.rows).find(r => r.cells.length === hr.cells.length);
        if (!br) return;
        for (let i = 0; i < hr.cells.length; i++) {
          hr.cells[i].classList.toggle('n', br.cells[i].classList.contains('n'));
        }
      });
    }

    function render() {
      $('#rail').innerHTML = rail();
      const t = String(S.tab);
      $('#view').innerHTML = t === 'plan' ? viewPlan() : t === 'kpi' ? viewKpi()
        : t === '0' ? view0() : t === '1' ? view1() : t === '2' ? view2()
          : t === '3' ? view3() : t === '4' ? view4() : view5();
      $('#speeds').innerHTML = SPEEDS.map(s => '<button data-speed="' + s + '" aria-pressed="' + (S.speed === s) + '">' + s + '×</button>').join('');
      $('#clock').textContent = hhmm(now());
      alignHeaders();
      acc = 0;          // mỗi lần vẽ lại thì hẹn giờ tick chạy lại từ đầu
      save();
    }
    function live() {
      $('#clock').textContent = hhmm(now());
      document.querySelectorAll('[data-live]').forEach(el => {
        const [k, a, b] = el.getAttribute('data-live').split(':');
        if (k === 'step') { const mo = byId(+a); if (mo) el.textContent = dur(stepElapsed(mo, +b)); return; }
        if (k === 'steptong') {
          const mo = byId(+a), t = mo && stepTong(mo, +b);
          if (t) el.innerHTML = dur(t.ms) + (t.soVong > 1 ? '<span class="calc">' + t.soVong + ' vòng</span>' : '');
          return;
        }
        if (k === 'pack') { const mo = byId(+a); if (mo && mo.packing?.startedAt) el.textContent = dur((mo.packing.completedAt || now()) - mo.packing.startedAt); return; }
        if (k === 'mowait') { const mo = byId(+a), rs = mo ? runsOf(mo) : []; if (rs.length) el.textContent = dur(Math.max(...rs.map(waitMs))); return; }
        if (k === 'moact') { const mo = byId(+a), rs = mo ? runsOf(mo) : []; if (rs.length) el.textContent = dur(Math.max(...rs.map(actualMs))); return; }
        if (k === 'motime') { const mo = byId(+a); if (mo) el.innerHTML = timeCell(mo); return; }
        if (k === 'moqty') { const mo = byId(+a); if (mo) el.innerHTML = qtyCell(mo); return; }
        const r = runById(a); if (!r) return;
        if (k === 'rwait') el.textContent = dur(waitMs(r));
      });
    }

    /* ══ Camera quét QR ═════════════════════════════════════
       Dùng html5-qrcode: nó tự quản luồng camera và tự chuyển sang
       BarcodeDetector của trình duyệt khi có (nhanh hơn, dùng phần cứng).
    
       Đánh số phiên thay vì dùng cờ bật/tắt. Cờ rất dễ kẹt: nếu đóng camera
       lúc nó còn đang khởi động thì cờ bật lên SAU khi phiên đã huỷ, và mọi
       lần mở sau đều bị chặn im lặng. */
    let camQ = null, camPhien = 0;

    function camBao(html, err) {
      const m = $('#cam-msg');
      if (m) { m.innerHTML = html; m.className = err ? 'err' : ''; }
    }

    function moCam() {
      dongCam();                                  // dọn sạch phiên trước, dù nó đang ở trạng thái nào
      const box = $('#cam'); if (!box) return;
      const phien = ++camPhien;
      box.hidden = false;
      camBao('Đang mở camera…');

      if (typeof Html5Qrcode !== 'function') {
        camBao('Chưa tải được bộ giải mã QR. Kiểm tra mạng rồi mở lại, hoặc dùng đầu đọc cắm USB.', true);
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        camBao('Trình duyệt này không cho truy cập camera. Dùng đầu đọc QR cắm USB, hoặc nhập tay.', true);
        return;
      }

      let q;
      try { q = new Html5Qrcode('cam-view', { useBarCodeDetectorIfSupported: true, verbose: false }); }
      catch (e) { camBao('Không khởi tạo được bộ quét: ' + ((e && e.message) || e), true); return; }
      camQ = q;

      q.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1 },
        function (doc) { if (phien === camPhien) camTrung(doc); },
        function () { /* mỗi khung không thấy mã — bỏ qua, không phải lỗi */ }
      ).then(function () {
        if (phien !== camPhien) { try { q.stop(); } catch (e) { } return; }   // đã bị đóng lúc đang khởi động
        camBao('Đưa mã QR vào khung');
      }).catch(function (e) {
        if (phien !== camPhien) return;
        const ten = (e && e.name) || String(e);
        camBao(/NotAllowed|Permission/i.test(ten)
          ? 'Bạn đã từ chối quyền camera. Bật lại trong cài đặt trình duyệt rồi thử lại.'
          : /NotFound|Devices/i.test(ten)
            ? 'Máy này không có camera.'
            : /NotReadable|TrackStart/i.test(ten)
              ? 'Camera đang bị ứng dụng khác chiếm. Đóng ứng dụng đó rồi thử lại.'
              : /Secure|https/i.test(String(e))
                ? 'Camera chỉ chạy trên HTTPS.'
                : 'Không mở được camera — ' + ten + ': ' + ((e && e.message) || ''), true);
      });
    }

    function camTrung(raw) {
      const r = docMaMO(raw);
      if (!r.ma) { camBao(esc(r.loi), true); return; }   // đọc được QR nhưng không phải mã MO → báo, vẫn quét tiếp
      if (navigator.vibrate) navigator.vibrate(60);
      camBao('<b>' + esc(r.ma) + '</b> — đã đọc');
      dongCam();
      xuLyQuet(raw);
    }

    function dongCam() {
      camPhien++;                                  // mọi callback của phiên cũ tự vô hiệu
      const q = camQ; camQ = null;
      const box = $('#cam'); if (box) box.hidden = true;
      if (!q) return;
      try {
        const p = q.stop();
        if (p && p.then) p.then(function () { try { q.clear(); } catch (e) { } }).catch(function () { });
      } catch (e) { }
    }

    /* ══ Quét QR → kích hoạt bước ═══════════════════════════
       Mã QR chỉ nói MO NÀO. Bước nào được kích hoạt lấy từ TAB đang mở —
       máy đặt ở trạm QC thì quét là QC nhận. */
    function bcQuet(html, kind) {
      const box = $('#qrbox'), t = $('#qrtxt');
      if (box) box.className = 'qrbox' + (kind ? ' ' + kind : '');
      if (t) t.innerHTML = html;
    }
    let qrKey = null, qrLuc = 0;
    function xuLyQuet(raw) {
      const r = docMaMO(raw);
      if (!r.ma) { bcQuet(esc(r.loi), 'err'); toast(r.loi, true); return; }
      const ma = r.ma;

      /* Đầu đọc hay bắn hai lần — bỏ qua lần trùng trong 2 giây.
         Khoá theo MÃ + TRẠM chứ không chỉ theo mã: cùng một MO quét tiếp ở trạm
         kế bên phải ăn ngay, không bị chặn oan. */
      const gio = Date.now(), khoa = ma + '@' + S.tab;
      if (khoa === qrKey && gio - qrLuc < 2000) return;
      qrKey = khoa; qrLuc = gio;

      const buoc = parseInt(S.tab, 10);
      if (isNaN(buoc)) {
        bcQuet('<b>' + esc(ma) + '</b> — mở tab của trạm rồi quét', 'err');
        toast('Màn hình này không nhận quét — mở tab Kho / Setup / QC / Bàn team leader / Sản xuất / Nhập kho', true);
        return;
      }

      const mo = queue(buoc).find(m => m.code === ma);
      if (!mo) {
        const khac = S.mos.find(m => m.code === ma);
        const ly = !khac ? 'không có trong hệ thống'
          : atStep(buoc).some(m => m.code === ma) ? 'đã nhận ở trạm này rồi'
            : 'đang ở ' + (khac.step == null ? khac.status : STEP_NM[khac.step]);
        bcQuet('<b>' + esc(ma) + '</b> — ' + esc(ly), 'err');
        toast(ma + ' — ' + ly + ', không nhận được ở ' + STEP_NM[buoc], true);
        render(); return;
      }

      let ok;
      if (buoc === 0) { khoAccept(mo); ok = true; } else { ok = accept(mo, buoc); }
      if (ok) {
        bcQuet('<b>' + esc(ma) + '</b> → ' + esc(STEP_NM[buoc]) + ' đã nhận', 'hit');
        toast(ma + ' — ' + STEP_NM[buoc] + ' nhận qua QR, bước trước đóng tự động.');
      }
      render();
    }

    /* Đầu đọc QR gõ như bàn phím: rất nhanh rồi Enter.
       Dựa vào tốc độ gõ để phân biệt với người gõ tay. */
    let qrDem = '', qrPhim = 0;
    const QR_NGUONG_MS = 50;           // scanner ~10-30ms/ký tự · người gõ tay >100ms
    document.addEventListener('keydown', function (ev) {
      const ae = document.activeElement;
      if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
      const gio = Date.now();
      if (gio - qrPhim > QR_NGUONG_MS) qrDem = '';
      qrPhim = gio;
      if (ev.key === 'Enter') { const d = qrDem; qrDem = ''; if (d) xuLyQuet(d); return; }
      if (ev.key.length === 1) qrDem += ev.key;
    });

    /* ══ Sự kiện ════════════════════════════════════════════ */
    const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
    const nval = id => { const v = parseInt(val(id), 10); return isNaN(v) ? 0 : v; };

    document.addEventListener('click', ev => {
      const tb = ev.target.closest('[data-tab]');
      if (tb) { S.tab = tb.getAttribute('data-tab'); S.ui = { mode: S.ui.mode }; render(); return; }
      const sp = ev.target.closest('[data-speed]');
      if (sp) { S.speed = +sp.getAttribute('data-speed'); render(); return; }
      const el = ev.target.closest('[data-act]'); if (!el) return;
      const act = el.getAttribute('data-act');
      const mo = el.hasAttribute('data-mo') ? byId(+el.getAttribute('data-mo')) : null;
      const run = el.hasAttribute('data-run') ? runById(el.getAttribute('data-run')) : null;

      switch (act) {
        case 'reseed': seed(); render(); toast('Đã nạp 11 MO mẫu.'); return;
        case 'clear': S = blank(); render();
          toast('Đã xóa sạch. Bắt đầu ở tab Kế hoạch — tạo MO rồi Submit để lệnh chạy sang Kho.'); return;
        case 'reset-clock': resetClock();
          toast('Giờ xưởng về ' + hhmm(S.now) + ' — mọi mốc dịch theo nên số đo không đổi.'); break;
        case 'mo-detail': S.ui.detail = S.ui.detail === mo.id ? null : mo.id; break;
        case 'sx-trace': {
          const khoa = mo.id + ':' + el.getAttribute('data-round');
          S.ui.sxTrace = S.ui.sxTrace === khoa ? null : khoa;
          break;
        }
        case 'toggle-log': S.ui.log = !S.ui.log; break;
        case 'cam-open': moCam(); return;
        case 'cam-close': dongCam(); return;
        case 'mode': S.ui.mode = el.getAttribute('data-mode'); break;
        case 'pick': { const b = document.getElementById('scan-' + S.tab); if (b) { b.value = el.getAttribute('data-code'); b.focus(); return; } break; }

        case 'create': {
          const one = el.getAttribute('data-one') === '1';
          const prod = val('p-prod') || 'Sản phẩm', qty = Math.max(1, nval('p-qty')),
            mins = Math.max(1, nval('p-mins')), box = Math.max(0, nval('p-box'));
          if (one) {
            const code = chuanHoaQuet(val('p-code'));
            if (!MO_STRICT.test(code)) { toast('Mã MO phải có dạng M + 6 chữ số, ví dụ M067690.', true); return; }
            if (S.mos.some(m => m.code === code)) { toast('Mã ' + code + ' đã tồn tại — MO Code unique toàn hệ thống.', true); return; }
            const m = mkMo(code, prod, qty, mins, box); S.mos.push(m);
            log(m, null, 'MO_CREATE', '', 'DRAFT', prod + ' · ' + nfmt(qty) + ' PCS'); toast('Đã tạo ' + code + '.');
          } else createBatch(Math.max(1, nval('p-start')), Math.max(1, Math.min(100, nval('p-count'))), prod, qty, mins, box);
          break;
        }
        case 'import': importCsv(val('csv')); break;
        case 'submit-one': submit([mo]); break;
        case 'submit-all': submit(S.mos.filter(m => m.status === 'DRAFT')); break;
        case 'cancel-open': S.ui.cancel = S.ui.cancel === mo.id ? null : mo.id; break;
        case 'cancel': cancel(mo, val('cr-' + mo.id) || 'không ghi lý do'); S.ui.cancel = null; break;

        case 'kho-accept': khoAccept(mo); break;
        case 'kho-accept-all': { const q = queue(0); q.forEach(khoAccept); toast('Đã Accept ' + q.length + ' lệnh.'); break; }
        case 'slip': S.ui.slip = S.ui.slip === mo.id ? null : mo.id; break;
        case 'kho-handover': khoHandover(mo); break;
        case 'kho-handover-all': {
          const h = S.mos.filter(m => m.kho.acceptedAt && !m.kho.handedOverAt);
          h.forEach(khoHandover); toast('Đã bàn giao ' + h.length + ' phiếu.'); break;
        }

        case 'scan': {
          const n = +el.getAttribute('data-step');
          const raw = val('scan-' + n).trim();
          if (!raw) { toast('Quét hoặc nhập MO Code trước.', true); return; }
          const inp = document.getElementById('scan-' + n); if (inp) inp.value = '';
          xuLyQuet(raw);            // chung bộ đọc với đầu đọc QR
          return;
        }
        case 'accept': if (accept(mo, +el.getAttribute('data-step')))
          toast(mo.code + ' — Accept xong, bước trước đóng tự động.'); break;

        case 'qc-open': S.ui.qc = S.ui.qc === mo.id ? null : mo.id; break;
        case 'qc-pass': qcDecide(mo, true); S.ui.qc = null; toast(mo.code + ' — PASS, chờ Bàn team leader Accept.'); break;
        case 'qc-fail': qcDecide(mo, false, val('qr-' + mo.id)); S.ui.qc = null;
          toast(mo.code + ' — FAIL, quay về Step1 (Rework).'); break;

        case 'pick-line': {
          const l = +el.getAttribute('data-line');
          if (!S.ui.pick || S.ui.pick.mo !== mo.id) S.ui.pick = { mo: mo.id, lines: [] };
          const i = S.ui.pick.lines.indexOf(l);
          if (i >= 0) S.ui.pick.lines.splice(i, 1); else S.ui.pick.lines.push(l);
          S.ui.pick.lines.sort((a, b) => a - b);
          break;
        }
        case 'add-picked': {
          const p = (S.ui.pick && S.ui.pick.mo === mo.id) ? S.ui.pick.lines.slice() : [];
          if (!p.length) { toast('Chưa chọn line nào.', true); return; }
          let n = 0;
          p.forEach(l => { if (addRun(mo, l)) n++; });
          S.ui.pick = null;
          if (n) toast('Đã thêm ' + n + ' line (' + lineList(runsOf(mo)) + ') vào bảng — 1 MO 1 dòng');
          break;
        }
        /* Nút ở bảng đang chạy — thao tác ở cấp MO vì 1 MO = 1 dòng (§7.2) */
        case 'mo-run-start': {
          const rs = runsOf(mo).filter(r => r.status === 'WAIT');
          if (!rs.length) { toast('Không có line nào đang chờ', true); break; }
          rs.forEach(r => runStart(r));
          toast(mo.code + ' — Đang lắp ráp ' + lineList(rs) + '. TG chờ dừng, TG thực tế bắt đầu đếm.');
          break;
        }
        case 'mo-pause': {
          if (!runsOf(mo).some(r => r.status === 'RUN')) { toast('Không có line nào đang chạy', true); break; }
          S.ui.hold = S.ui.hold === mo.id ? null : mo.id;
          break;
        }
        case 'mo-hold-cancel': S.ui.hold = null; break;
        case 'mo-hold-ok': {
          const ly = val('hold-' + mo.id).trim();
          if (!ly) { toast('Bắt buộc ghi lý do dừng (§17).', true); return; }
          const rs = runsOf(mo).filter(r => r.status === 'RUN');
          if (!rs.length) { toast('Không có line nào đang chạy', true); S.ui.hold = null; break; }
          rs.forEach(r => runHold(r, ly));
          S.ui.hold = null;
          toast(mo.code + ' — dừng ' + lineList(rs) + ': ' + ly + '. TG thực tế đứng lại, TG chờ chạy tiếp.');
          break;
        }

        case 'finish-all': S.ui.sxDone = S.ui.sxDone === mo.id ? null : mo.id; break;
        case 'sx-done-cancel': S.ui.sxDone = null; break;
        case 'sx-done-ok': {
          if (finishAll(mo, nval('sxok-' + mo.id), nval('sxng-' + mo.id), nval('sxth-' + mo.id),
            val('sxngr-' + mo.id), val('sxthr-' + mo.id)))
            S.ui.sxDone = null;
          break;
        }
        case 'pack-start': packingStart(mo); break;
        case 'pack-finish-open': S.ui.packFinish = mo.id; break;
        case 'pack-finish-cancel': S.ui.packFinish = null; break;
        case 'pack-finish-ok': {
          if (packingFinish(mo, nval('packqty-' + mo.id), val('packreason-' + mo.id))) S.ui.packFinish = null;
          break;
        }
        case 'hour-add': { const mid = +val('hour-mo'); const slot = val('hour-slot'); const people = nval('hour-people'); const target = nval('hour-target'); const qty = nval('hour-qty'); const note = val('hour-note'); if (!mid) { toast('Chọn MO', true); break; } addHourly(mid, slot, people, target, qty, note); break; }
        case 'pbox-add': { const pid = +val('pbox-mo'); if (!pid) { toast('Chọn MO', true); break; } addPackHourly(pid, val('pbox-slot'), nval('pbox-n'), val('pbox-note')); break; }
        case 'finish-mo': if (finishMo(mo)) toast(mo.code + ' — COMPLETED.'); break;
      }
      render();
    });
    document.addEventListener('keydown', ev => {
      if (ev.key === 'Escape' && !$('#cam').hidden) { dongCam(); return; }
      if (ev.key !== 'Enter') return;
      const id = ev.target.id || '';
      if (id === 'qr-sim') { const v = ev.target.value; ev.target.value = ''; if (v) xuLyQuet(v); return; }
      if (id.indexOf('scan-') !== 0) return;
      const b = document.querySelector('[data-act="scan"][data-step="' + id.split('-')[1] + '"]');
      if (b) b.click();
    });

    /* ══ Vòng chạy ══════════════════════════════════════════ */
    let last = Date.now(), acc = 0, pDown = false;
    /* Không vẽ lại trong lúc con trỏ đang nhấn: nếu render() thay nút giữa mousedown và
       mouseup thì trình duyệt không phát sinh click, thao tác bị mất trắng. */
    addEventListener('pointerdown', () => { pDown = true; }, true);
    addEventListener('pointerup', () => { pDown = false; }, true);
    addEventListener('pointercancel', () => { pDown = false; }, true);
    setInterval(() => {
      const d = Date.now() - last; last = Date.now();
      S.now += d * S.speed; acc += d;
      const typing = document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
      if (acc >= 1000 && !typing && !pDown) render(); else live();
    }, 250);

    const r = load();
    if (r) {
      S = r; S.ui = S.ui || { mode: 'batch' };
      if (!S.packHourly) S.packHourly = [];
      // MO tạo trước v2.22 chưa có quy cách → 0, nghĩa là không đếm thùng. Không đoán
      // một quy cách vào đó: đoán sai là quy đổi sai toàn bộ tiến độ của đơn.
      S.mos.forEach(m => { if (m.pcsPerBox === undefined) m.pcsPerBox = 0; });
      // Hàng ghi trước khi có `people`/`target` thì để null — bảng hiện '—'.
      // Đoán một con số vào đó là bịa ra năng suất chưa ai đo.
      if (!S.hourly) S.hourly = [];
      else S.hourly.forEach(h => {
        if (h.note === undefined) h.note = '';
        if (h.people === undefined) h.people = null;
        if (h.target === undefined) h.target = null;
      });
      // migrate: bỏ step 6 cũ, thêm packing song song
      S.mos.forEach(m => {
        if (!m.packing) m.packing = { startedAt: null, completedAt: null, by: null, qtyPacked: null, packingReason: null };
        if (m.packing && m.packing.qtyPacked === undefined) m.packing.qtyPacked = null;
        if (m.packing && m.packing.packingReason === undefined) m.packing.packingReason = null;
        if (m.steps && m.steps[6]) {
          if (!m.packing.startedAt && m.steps[5]?.acceptedAt) { m.packing.startedAt = m.steps[5].acceptedAt; m.packing.by = m.steps[5].by; }
          delete m.steps[6]; if (m.steps[5] && m.steps[5].acceptedAt && !m.steps[5].completedAt && m.status === 'PROCESSING' && m.packing.completedAt) m.steps[5].completedAt = m.packing.completedAt;
        }
        if (m.step === 6) m.step = 5;
      });
    } else S = blank();   // mặc định bảng trắng
    render();
  })();
</script>
