<title>MES Bản Chốt v2.3</title>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F2F5F6;
    --surface: #FFFFFF;
    --surface-2: #E8EDEF;
    --surface-3: #F7FAFA;
    --ink: #131A1D;
    --ink-2: #56656B;
    --ink-3: #7D8B90;
    --line: #D5DEE0;
    --line-strong: #B9C6C9;
    --accent: #0C6B7A;
    --accent-ink: #FFFFFF;
    --accent-tint: #E4F1F3;
    --ok: #1B7A45;
    --ok-bg: #E2F1E8;
    --warn: #8E5A08;
    --warn-bg: #FAEFDC;
    --bad: #A82C2C;
    --bad-bg: #F9E6E5;
    --shadow: 0 1px 2px rgba(19, 26, 29, .06), 0 4px 14px rgba(19, 26, 29, .05);
    --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1213;
      --surface: #151D1F;
      --surface-2: #1D2729;
      --surface-3: #111A1C;
      --ink: #E4EDEF;
      --ink-2: #94A5AA;
      --ink-3: #6E8085;
      --line: #29373A;
      --line-strong: #3A4B4F;
      --accent: #48AFC0;
      --accent-ink: #06181C;
      --accent-tint: #12292D;
      --ok: #55BE82;
      --ok-bg: #12301F;
      --warn: #D9A548;
      --warn-bg: #33260F;
      --bad: #E8736D;
      --bad-bg: #351A19;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .28);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0D1213;
    --surface: #151D1F;
    --surface-2: #1D2729;
    --surface-3: #111A1C;
    --ink: #E4EDEF;
    --ink-2: #94A5AA;
    --ink-3: #6E8085;
    --line: #29373A;
    --line-strong: #3A4B4F;
    --accent: #48AFC0;
    --accent-ink: #06181C;
    --accent-tint: #12292D;
    --ok: #55BE82;
    --ok-bg: #12301F;
    --warn: #D9A548;
    --warn-bg: #33260F;
    --bad: #E8736D;
    --bad-bg: #351A19;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .28);
  }

  * {
    box-sizing: border-box
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    padding: 0
  }

  h1,
  h2,
  h3 {
    margin: 0;
    text-wrap: balance;
    font-weight: 600;
    letter-spacing: -.01em
  }

  button {
    font: inherit;
    cursor: pointer
  }

  input,
  select,
  textarea {
    font: inherit;
    color: inherit
  }

  .mono {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums
  }

  .wrap {
    max-width: 1380px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 0 48px
  }

  @media(min-width:900px) {
    .wrap {
      padding-inline: 24px
    }
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--line)
  }

  .topbar .wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 18px;
    align-items: center;
    padding-block: 12px
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 1px;
    margin-right: auto
  }

  .brand b {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.015em
  }

  .brand span {
    font-size: 11px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: .09em
  }

  .clockbox {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px
  }

  .clockbox .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-3)
  }

  #clock {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums
  }

  .speeds {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden
  }

  .speeds button {
    background: var(--surface);
    border: 0;
    border-right: 1px solid var(--line);
    color: var(--ink-2);
    padding: 6px 9px;
    font-size: 12px;
    font-family: var(--mono)
  }

  .speeds button:last-child {
    border-right: 0
  }

  .speeds button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600
  }

  .qrbox {
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    background: var(--surface-2);
    max-width: 100%
  }

  .qrbox .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
    flex: 0 0 auto
  }

  .qrbox.err .dot {
    background: var(--bad)
  }

  .qrbox.hit .dot {
    background: var(--accent)
  }

  .qrbox .txt {
    font-size: 11.5px;
    color: var(--ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px
  }

  .qrbox .txt b {
    font-family: var(--mono);
    color: var(--ink)
  }

  .qrbox input {
    width: 128px;
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 3px 7px
  }

  .btn-cam {
    display: inline-flex;
    align-items: center;
    gap: 6px
  }

  /* ── lớp phủ camera ── */
  #cam[hidden] {
    display: none !important
  }

  #cam {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(8, 14, 16, .92);
    display: grid;
    place-items: center;
    padding: 16px
  }

  .cam-box {
    width: min(92vw, 460px);
    display: flex;
    flex-direction: column;
    gap: 12px
  }

  .cam-wrap {
    position: relative;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    max-width: 100%
  }

  #cam-view {
    width: 100%;
    height: 100%
  }

  #cam-view video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
    display: block
  }

  #cam-view img {
    display: none
  }

  .cam-frame {
    position: absolute;
    inset: 16%;
    border-radius: 8px;
    pointer-events: none
  }

  .cam-frame i {
    position: absolute;
    width: 26px;
    height: 26px;
    border: 3px solid #fff
  }

  .cam-frame i:nth-child(1) {
    top: 0;
    left: 0;
    border-right: 0;
    border-bottom: 0;
    border-radius: 8px 0 0 0
  }

  .cam-frame i:nth-child(2) {
    top: 0;
    right: 0;
    border-left: 0;
    border-bottom: 0;
    border-radius: 0 8px 0 0
  }

  .cam-frame i:nth-child(3) {
    bottom: 0;
    left: 0;
    border-right: 0;
    border-top: 0;
    border-radius: 0 0 0 8px
  }

  .cam-frame i:nth-child(4) {
    bottom: 0;
    right: 0;
    border-left: 0;
    border-top: 0;
    border-radius: 0 0 8px 0
  }

  .cam-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px
  }

  #cam-msg {
    flex: 1;
    min-width: 150px;
    font-size: 12.5px;
    color: var(--ink-2)
  }

  #cam-msg b {
    font-family: var(--mono);
    color: var(--ink)
  }

  #cam-msg.err {
    color: var(--bad)
  }

  .rail {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 57px;
    z-index: 25
  }

  .rail-scroll {
    display: flex;
    overflow-x: auto;
    scrollbar-width: thin
  }

  .st {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px 15px;
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--ink-2);
    white-space: nowrap
  }

  .st:hover {
    background: var(--surface-2)
  }

  .st[aria-selected="true"] {
    color: var(--ink);
    border-bottom-color: var(--accent);
    background: var(--accent-tint)
  }

  .st .num {
    font-family: var(--mono);
    font-size: 11px;
    width: 19px;
    height: 19px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--ink-3);
    font-weight: 600
  }

  .st[aria-selected="true"] .num {
    background: var(--accent);
    color: var(--accent-ink)
  }

  .st .nm {
    font-size: 13px;
    font-weight: 500
  }

  .st .ct {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 20px;
    background: var(--surface-2);
    color: var(--ink-2)
  }

  .cols {
    display: grid;
    gap: 16px;
    margin-top: 18px
  }

  @media(min-width:1000px) {
    .cols.two {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
    }
  }

  /* Tab Kế hoạch: form gọn bên trái, sổ lệnh 8 cột lấy hết phần còn lại */
  @media(min-width:1000px) {
    .cols.plan {
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr)
    }
  }

  .tscroll.tall {
    max-height: 62vh;
    overflow: auto
  }

  .tscroll.tall th {
    position: sticky;
    top: 0;
    z-index: 1
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-width: 0
  }

  .panel>header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line)
  }

  .panel>header h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--ink-2)
  }

  .panel>header .meta {
    margin-left: auto;
    font-size: 11px;
    color: var(--ink-3);
    font-family: var(--mono)
  }

  .panel .body {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px
  }

  .panel .body.flush {
    padding: 0
  }

  .row {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 11px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface-3)
  }

  .row.live {
    background: var(--surface);
    border-color: var(--line-strong)
  }

  .rhead {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap
  }

  .code {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -.01em
  }

  .prod {
    font-size: 12px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0
  }

  .rmeta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--ink-2);
    font-family: var(--mono)
  }

  .rmeta b {
    color: var(--ink);
    font-weight: 600
  }

  .acts {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center
  }

  .acts.nowrap {
    flex-wrap: nowrap
  }

  .pill {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 2px 7px;
    border-radius: 20px;
    background: var(--surface-2);
    color: var(--ink-2);
    white-space: nowrap
  }

  .pill b {
    font-variant-numeric: tabular-nums
  }

  .pack-timer b {
    display: inline-block;
    min-width: 148px;
    text-align: center
  }

  .rmeta [data-live] {
    display: inline-block;
    min-width: 148px;
    font-variant-numeric: tabular-nums
  }

  [data-live^="pack"],
  [data-live^="step"] {
    font-variant-numeric: tabular-nums
  }

  .pill.ok {
    background: var(--ok-bg);
    color: var(--ok)
  }

  .pill.warn {
    background: var(--warn-bg);
    color: var(--warn)
  }

  .pill.bad {
    background: var(--bad-bg);
    color: var(--bad)
  }

  .pill.acc {
    background: var(--accent-tint);
    color: var(--accent)
  }

  .btn {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: 5px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-weight: 500;
    transition: background .12s
  }

  .btn:hover {
    background: var(--surface-2)
  }

  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600
  }

  .btn.primary:hover {
    filter: brightness(1.08)
  }

  .btn.good {
    border-color: var(--ok);
    color: var(--ok)
  }

  .btn.danger {
    border-color: var(--bad);
    color: var(--bad)
  }

  .btn.ghost {
    border-color: transparent;
    color: var(--ink-3);
    padding-inline: 7px
  }

  .btn.ghost:hover {
    color: var(--ink);
    background: var(--surface-2)
  }

  .btn[disabled] {
    opacity: .4;
    cursor: not-allowed
  }

  .btn.sm {
    padding: 3px 8px;
    font-size: 11.5px
  }

  input[type=text],
  input[type=number],
  select,
  textarea {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    padding: 5px 8px;
    font-size: 12.5px;
    min-width: 0
  }

  textarea {
    font-family: var(--mono);
    font-size: 11.5px;
    width: 100%;
    resize: vertical
  }

  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px
  }

  .num-in {
    width: 78px;
    font-family: var(--mono);
    text-align: right
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px
  }

  .field label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--ink-3);
    line-height: 1.25;
    min-height: 26px;
    display: flex;
    align-items: flex-end
  }

  .formgrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
    align-items: end
  }

  .formgrid .field input,
  .formgrid .field select {
    width: 100%;
    height: 32px;
    box-sizing: border-box
  }

  @media(max-width:520px) {
    .formgrid {
      grid-template-columns: 1fr
    }

    .field label {
      min-height: auto
    }
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2px
  }

  .tabs button {
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--ink-3);
    padding: 6px 9px;
    font-size: 12.5px
  }

  .tabs button[aria-pressed="true"] {
    color: var(--ink);
    border-bottom-color: var(--accent);
    font-weight: 600
  }

  .scan {
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--accent-tint);
    border: 1px dashed var(--accent);
    border-radius: 6px;
    padding: 10px 11px;
    flex-wrap: wrap
  }

  .scan input {
    flex: 1;
    min-width: 150px;
    font-family: var(--mono);
    font-weight: 600
  }

  .scan .hint {
    font-size: 11px;
    color: var(--ink-2);
    flex-basis: 100%
  }

  .empty {
    color: var(--ink-3);
    font-size: 12.5px;
    padding: 14px 2px;
    text-align: center;
    font-style: italic
  }

  .tscroll {
    overflow-x: auto;
    overflow-y: hidden
  }

  .tscroll.tall {
    max-height: 62vh;
    overflow: auto
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
    table-layout: auto
  }

  th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--ink-3);
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    background: var(--surface-3);
    vertical-align: middle;
    height: 36px;
    box-sizing: border-box
  }

  th u {
    text-decoration: none;
    color: var(--accent);
    font-family: var(--mono)
  }

  .tscroll.tall th {
    position: sticky;
    top: 0;
    z-index: 1
  }

  td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    vertical-align: middle;
    box-sizing: border-box
  }

  td.acts {
    white-space: normal;
    padding: 4px 8px
  }

  td.acts .btn {
    flex: 0 0 auto
  }

  .panel .body.flush {
    display: block;
    padding: 0
  }

  .tscroll.tall {
    scrollbar-gutter: stable
  }

  /* Cố định độ rộng tối thiểu từng cột sổ lệnh để không bị co lệch khi nội dung dài — cột thao tác đủ chỗ 2 nút */
  .cols.plan .tscroll table th:nth-child(1),
  .cols.plan .tscroll table td:nth-child(1) {
    min-width: 148px
  }

  .cols.plan .tscroll table th:nth-child(2),
  .cols.plan .tscroll table td:nth-child(2) {
    min-width: 120px
  }

  .cols.plan .tscroll table th:nth-child(3),
  .cols.plan .tscroll table td:nth-child(3) {
    min-width: 80px
  }

  .cols.plan .tscroll table th:nth-child(4),
  .cols.plan .tscroll table td:nth-child(4) {
    min-width: 160px
  }

  .cols.plan .tscroll table th:nth-child(5),
  .cols.plan .tscroll table td:nth-child(5) {
    min-width: 105px
  }

  .cols.plan .tscroll table th:nth-child(6),
  .cols.plan .tscroll table td:nth-child(6) {
    min-width: 95px
  }

  .cols.plan .tscroll table th:nth-child(7),
  .cols.plan .tscroll table td:nth-child(7) {
    min-width: 148px;
    width: 148px
  }

  .cols.plan .tscroll table td:nth-child(7) .acts {
    justify-content: flex-end;
    flex-wrap: nowrap
  }

  .cols.plan .tscroll table tr {
    height: 42px
  }

  table.sub {
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
    min-width: 600px;
    table-layout: auto
  }

  table.sub td,
  table.sub th {
    white-space: normal;
    vertical-align: top;
    height: auto
  }

  /* dòng Tổng của bảng "thời gian từng bước theo vòng" */
  table.sub tr.sum td {
    border-top: 2px solid var(--line-strong);
    background: var(--surface-2)
  }

  td.n {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right
  }

  th.n {
    text-align: right
  }

  /* header cột số căn phải cho khớp với ô bên dưới */
  td.n.running {
    color: var(--accent)
  }

  .calc.late {
    color: var(--bad)
  }

  tr.clickable {
    cursor: pointer
  }

  tr.clickable:hover>td {
    background: var(--surface-2)
  }

  tr.clickable.open>td {
    background: var(--accent-tint)
  }

  td.detail {
    background: var(--surface-3);
    padding: 12px 14px;
    white-space: normal
  }

  td.detail h3 {

<script>
  (function () {
    "use strict";

    /* ══ Hằng số theo BRD v2.3 ══════════════════════════════ */
    const LINES = 14;                                  // §7.1 — 14 line
    const SPEEDS = [1, 60, 600, 3600];
    const STEP_NM = { 0: 'Kho', 1: 'Setup máy', 2: 'QC', 3: 'Bàn team leader', 4: 'Sản xuất', 5: 'Nhập kho' };
    const ACTOR = { 0: 'Kho A', 1: 'Setup A', 2: 'QC1', 3: 'Bàn team leader', 4: 'Leader L1', 5: 'Kho nhập' };
    const ACTOR_PACK = 'Đóng thùng';
    const QC_REASONS = ['Sai thông số setup', 'Lỗi khuôn/gá', 'Lỗi vật tư đầu vào', 'Lỗi lắp ráp', 'Khác'];
    const STATIONS = [
      { n: 'plan', num: 'P', nm: 'Kế hoạch' }, { n: 0, num: 'K', nm: 'Kho' },
      { n: 1, num: '1', nm: 'Setup máy' }, { n: 2, num: '2', nm: 'QC' },
      { n: 3, num: '3', nm: 'Bàn team leader' }, { n: 4, num: '4', nm: 'Sản xuất' },
      { n: 5, num: '5', nm: 'Nhập kho' }, { n: 'kpi', num: '∑', nm: 'Lịch sử & KPI' }
    ];
    const KEY = 'mes-v2-console-4';
    /* Dọn state của các bản trước để lần mở này bắt đầu từ bảng trắng, không cần xóa cache tay */
    try {
      Object.keys(localStorage).forEach(k => {
        if (k.indexOf('mes-v2-console') === 0 && k !== KEY) localStorage.removeItem(k);
      });
    } catch (e) { }

    let S;
    function blank() {
      const d = new Date(); d.setHours(8, 0, 0, 0);
      return { now: d.getTime(), speed: 600, tab: 'plan', seq: 1, runSeq: 1, mos: [], history: [], hourly: [], packHourly: [], ui: { mode: 'batch' } };
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
    function load() { try { const r = localStorage.getItem(KEY); if (r) { const p = JSON.parse(r); if (p && p.mos) return p; } } catch (e) { } return null; }

    /* ══ Tiện ích ═══════════════════════════════════════════ */
    const now = () => S.now;
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const ymd = ts => {
      const d = new Date(ts);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };
    const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
    /* Thời lượng luôn hiển thị đủ 3 đơn vị: "16 giờ 0 phút 0 giây" */
    function dur(ms) {
      if (ms == null || ms < 0 || !isFinite(ms)) return '—';
      const s = Math.floor(ms / 1000);
      return Math.floor(s / 3600) + ' giờ ' + Math.floor(s % 3600 / 60) + ' phút ' + (s % 60) + ' giây';
    }
    const nfmt = n => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('vi-VN');
    let toastT;
    function toast(m, err) {
      const t = $('#toast'); t.textContent = m; t.className = err ? 'err' : ''; t.hidden = false;
      clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3600);
    }

    /* §9 — History append-only: MO, step, action, user, timestamp, from→to, reason, metadata */
    function log(mo, step, action, from, to, reason, kind) {
      S.history.push({
        at: now(), mo: mo ? mo.code : '—', step, action,
        user: step == null ? 'Planner' : ACTOR[step], from: from || '', to: to || '', reason: reason || '', kind: kind || ''
      });
    }

    /* ══ ĐỌC MÃ QUÉT ════════════════════════════════════════
       Mã MO thật: chữ M + đúng 6 chữ số. Khi quét luôn có ký tự đứng trước
       (đầu đọc chèn tiền tố) nên bỏ qua mọi thứ đứng trước chữ M.
       (?!\d) để "M0688201" (7 số) KHÔNG bị cắt thành "M068820" — quét nhầm
       mã dài hơn mà ra một mã có thật là loại lỗi không ai phát hiện được. */
    const MO_CORE = /M\d{6}(?!\d)/g;
    const MO_STRICT = /^M\d{6}$/;

    function chuanHoaQuet(raw) {
      return String(raw)
        .replace(/[-​-‍﻿]/g, '')   // ky tu dieu khien, zero-width
        .replace(/\s+/g, '')
        .toUpperCase();
    }
    function docMaMO(raw) {
      const t = chuanHoaQuet(raw);
      if (!t) return { ma: null, loi: 'Chuỗi quét rỗng' };

      let ds = [...new Set(t.match(MO_CORE) || [])];

      if (!ds.length) {                    // thử sửa nhầm O↔0, I/L↔1 trong 6 ký tự sau chữ M
        for (const u of (t.match(/M[A-Z0-9]{6}(?![A-Z0-9])/g) || [])) {
          const sua = 'M' + u.slice(1).replace(/O/g, '0').replace(/[IL]/g, '1');
          if (MO_STRICT.test(sua)) ds.push(sua);
        }
        ds = [...new Set(ds)];
      }
      if (ds.length === 1) return { ma: ds[0], loi: null };
      if (ds.length > 1) return { ma: null, loi: 'Quét ra nhiều mã: ' + ds.join(' · ') + ' — quét lại' };
      return { ma: null, loi: 'Không đọc được mã MO trong "' + t.slice(0, 28) + '"' };
    }

    const byId = id => S.mos.find(m => m.id === id);
    const allRuns = () => S.mos.flatMap(m => m.runs);
    const runById = id => allRuns().find(r => r.id === id);
    /* ══ VÒNG CHẠY ══ Mỗi lần MO quay về Kho là một vòng mới.
       Mọi tính toán (line, KPI, thời gian, sản lượng giờ) chỉ nhìn vòng hiện tại,
       dữ liệu vòng cũ vẫn giữ nguyên trong mo.runs / S.hourly để truy cứu.        */
    const roundOf = mo => mo.round || 1;
    const runsOf = mo => mo.runs.filter(r => (r.round || 1) === roundOf(mo));
    const activeRuns = () => S.mos.flatMap(m => runsOf(m));
    const remainOf = mo => Math.max(0, mo.qty - (mo.qtyDone || 0));   // không bao giờ âm
    const targetOf = mo => remainOf(mo);            // SL cần làm của riêng vòng này
    const lineList = rs => rs.map(r => 'L' + String(r.line).padStart(2, '0')).join(', ');
    /* C — Thời gian yêu cầu chia theo SL của vòng. Vòng 2 chỉ làm 1.000/10.000
       thì chỉ được 1/10 thời gian, nếu không thì vòng nào cũng Đạt.
       targetQty đóng dấu lúc thêm line nên MO đã xong vẫn giữ đúng mốc của vòng đó. */
    const roundTarget = mo => {
      const rs = runsOf(mo);
      return (rs.length && rs[0].targetQty) || targetOf(mo) || mo.qty;
    };
    const requiredMs = mo => Math.max(1000, Math.round(mo.requiredSec * 1000 * (roundTarget(mo) / mo.qty)));
    const sxOkOf = mo => (mo.sx && mo.sx.qtyOk != null) ? mo.sx.qtyOk : targetOf(mo);
    const ngTotal = mo => (mo.qtyNgTotal || 0) + (mo.sx?.qtyNg || 0);   // hỏng ghi ở bước Sản xuất

    const hourlySum = mo => (S.hourly || [])
      .filter(h => h.moId === mo.id && (h.round || 1) === roundOf(mo))
      .reduce((a, h) => a + h.qty, 0);
    const atStep = n => {
      if (n === 4) return S.mos.filter(m => m.step === 4 && m.steps[4]?.acceptedAt && !m.packing?.completedAt && m.status === 'PROCESSING');
      return S.mos.filter(m => m.step === n && m.steps[n] && m.steps[n].acceptedAt && m.steps[n].completedAt == null && m.status === 'PROCESSING');
    };

    /** Hàng đợi của mỗi bước — không có khái niệm WIP limit trong v2 */
    function queue(n) {
      let q;
      if (n === 0) q = S.mos.filter(m => !m.kho.acceptedAt &&
        (m.status === 'SUBMITTED' || (m.status === 'PROCESSING' && m.step === 0)));  // vòng mới đi lại từ hàng đợi Kho
      else if (n === 1) q = S.mos.filter(m => m.step === 0 && m.kho.handedOverAt && m.status === 'PROCESSING');
      else if (n === 3) q = S.mos.filter(m => m.step === 2 && m.qc && m.qc.result === 'PASS');   // QC PASS → Bàn team leader
      else if (n === 5) q = S.mos.filter(m => m.packing?.completedAt && m.steps[4]?.completedAt && !m.steps[5]?.acceptedAt && m.status === 'PROCESSING'); // chỉ khi Kết thúc đóng thùng xong và chưa Accept Nhập kho mới ở hàng đợi
      else q = S.mos.filter(m => m.steps[n - 1]?.acceptedAt && m.steps[n - 1].completedAt == null && m.status === 'PROCESSING');
      if (n !== 0 && n !== 1 && n !== 3 && n !== 5 && (!q || !q.length) && n !== 4) q = S.mos.filter(m => m.step === n - 1 && m.status === 'PROCESSING');
      return q;
    }

    /* ══ Timer — §9: mỗi bước 1 timer riêng ═════════════════
       actualDuration(N) = nextStep.acceptedAt − step.acceptedAt
       Không có readyAt: thời gian làm và thời gian chờ gộp làm một. */
    function stepElapsed(mo, n) {
      const s = mo.steps[n]; if (!s || !s.acceptedAt) return null;
      return (s.completedAt == null ? now() : s.completedAt) - s.acceptedAt;
    }

    /* ══ Hành động ══════════════════════════════════════════ */
    /* `pcsPerBox` — QUY CÁCH đóng thùng, bao nhiêu pcs một thùng. 0 = không đóng thùng.
       Đây là cầu nối DUY NHẤT giữa hai đơn vị: đơn hàng đặt bằng PCS, xưởng đếm bằng
       THÙNG. Thiếu nó thì không quy đổi được, mà quy đổi sai thì hàng lẻ bị đọc nhầm
       thành hàng thiếu (§7b.2). */
    function mkMo(code, product, qty, mins, pcsPerBox) {
      return {
        id: S.seq++, code, product, qty, unit: 'PCS', pcsPerBox: Math.max(0, pcsPerBox || 0),
        requiredSec: mins * 60,
        status: 'DRAFT', step: null, round: 1, steps: {}, cancel: null,
        kho: { acceptedAt: null, printedAt: null, printCount: 0, handedOverAt: null },
        veDau: 0,                 /* vòng hiện tại bắt đầu ở bước nào: 0 Kho · 3 Bàn team leader */
        qc: null, runs: [],
        /* SL hỏng thuộc bước SẢN XUẤT — chuyền mới là chỗ phát hiện hàng lỗi.
           Hàng xuống tới đóng thùng là hàng đã đạt. */
        sx: { qtyOk: null, qtyNg: null, qtyShort: null, ngReason: null, shortReason: null, at: null },
        packing: {
          startedAt: null, completedAt: null, by: null, qtyPacked: null,
          packingReason: null, remain: null, done: null
        },
        qtyDone: 0, qtyNgTotal: 0, qtyRemain: null, completedAt: null
      };
    }
    /* §2.2 — 1C tạo lẻ & hàng loạt · 2C tiền tố + số tự tăng · transaction toàn lô */
    /* Mã chạy liên tục: M + 6 chữ số (M068820, M068821…) */
    function createBatch(soDau, count, product, qty, mins, pcsPerBox) {
      const codes = new Set(S.mos.map(m => m.code)), made = [];
      for (let i = 0; i < count; i++) {
        const code = 'M' + String(soDau + i).padStart(6, '0');
        if (codes.has(code)) { toast('Trùng mã ' + code + ' — cả lô không được tạo (transaction, §2.2).', true); return; }
        codes.add(code); made.push(mkMo(code, product, qty, mins, pcsPerBox));
      }
      S.mos.push(...made);
      made.forEach(m => log(m, null, 'MO_CREATE', '', 'DRAFT', product + ' · ' + nfmt(qty) + ' PCS'));
      toast('Đã tạo ' + made.length + ' MO — trạng thái DRAFT.');
    }
    function importCsv(text) {
      const rows = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const codes = new Set(S.mos.map(m => m.code)), made = [];
      for (const line of rows) {
        const p = line.split(',').map(x => x.trim());
        if (p.length < 4) { toast('Dòng sai định dạng: "' + line + '" — cần ít nhất 4 cột.', true); return; }
        if (codes.has(chuanHoaQuet(p[0]))) { toast('Trùng mã ' + p[0] + ' — cả lô không được tạo.', true); return; }
        const ma = chuanHoaQuet(p[0]);
        if (!MO_STRICT.test(ma)) { toast('Mã sai định dạng: "' + p[0] + '" — cần M + 6 chữ số.', true); return; }
        codes.add(ma); made.push(mkMo(ma, p[1], +p[2] || 0, +p[3] || 1, +p[4] || 0));  // cột 5 tuỳ chọn: quy cách
      }
      S.mos.push(...made);
      made.forEach(m => log(m, null, 'MO_IMPORT', '', 'DRAFT', 'Import CSV'));
      toast('Đã import ' + made.length + ' MO.');
    }
    function submit(list) {
      list.forEach(m => {
        if (m.status !== 'DRAFT') return;
        m.status = 'SUBMITTED'; m.step = 0; log(m, null, 'MO_SUBMIT', 'DRAFT', 'SUBMITTED', '');
      });
      toast('Đã Submit ' + list.length + ' MO — khóa cứng mã/sản phẩm/SL/thời gian (§4A).');
    }
    /* §4A — không sửa được sau Submit; nhập sai thì CANCELLED + tạo MO mới, không hard delete */
    function cancel(mo, reason) {
      const from = mo.status; mo.status = 'CANCELLED'; mo.cancel = { at: now(), by: 'Planner', reason };
      log(mo, null, 'MO_CANCEL', from, 'CANCELLED', reason, 'rv');
      toast(mo.code + ' đã hủy. Bản ghi vẫn giữ — tạo MO mới để thay thế (§4A).');
    }
    /* §3 — Kho: nhận → in → bàn giao */
    function khoAccept(mo) {
      mo.kho.acceptedAt = now(); mo.status = 'PROCESSING';
      log(mo, 0, 'KHO_ACCEPT', 'SUBMITTED', 'PROCESSING', '');
    }
    /* §3 — BỎ thao tác In phiếu. Kho nhận lệnh xong là bàn giao luôn, bớt một lần bấm.
       Xem phiếu vẫn còn nhưng chỉ để xem/in bằng trình duyệt, hệ thống không ghi sổ. */
    function khoPrint(mo) {
      mo.kho.printedAt = now(); mo.kho.printCount++;
      log(mo, 0, 'KHO_PRINT', '', '', 'Lần in #' + mo.kho.printCount);
    }
    function khoHandover(mo) {
      mo.kho.handedOverAt = now(); log(mo, 0, 'KHO_HANDOVER', 'Kho', 'Step1', 'Bàn giao trên hệ thống (§6B)'); return true;
    }
    /* §9 — mỗi Accept là 1 transaction: auto-complete bước trước → ghi acceptedAt → update currentStep */
    function accept(mo, n) {
      if (n === 1 && !mo.kho.handedOverAt) { toast('Chưa HANDOVER — Setup không được Accept (§3.2).', true); return false; }
      const prev = mo.steps[n - 1];
      if (prev && prev.acceptedAt && prev.completedAt == null) {
        prev.completedAt = now();
        log(mo, n - 1, 'STEP' + (n - 1) + '_AUTO_COMPLETE', 'ĐANG LÀM', 'HOÀN THÀNH',
          'triggeredBy = ' + STEP_NM[n] + ' Accept', 'sys');
      }
      const had = mo.steps[n] && mo.steps[n].acceptedAt;
      mo.steps[n] = { acceptedAt: now(), completedAt: null, by: ACTOR[n] };
      mo.step = n;
      log(mo, n, 'STEP' + n + '_ACCEPT', STEP_NM[n - 1] || '', STEP_NM[n],
        had ? '⚠ ghi đè mốc giờ của lần trước (rework)' : '', had ? 'rv' : '');
      return true;
    }
    function packingStart(mo) {
      if (mo.packing.startedAt) { toast('Đã bắt đầu đóng thùng rồi — ' + mo.code, true); return false; }
      if (!runsOf(mo).some(r => r.status === 'RUN' || r.status === 'DONE')) { toast('SX chưa bắt đầu — hãy bấm Đang lắp ráp ở bảng dưới trước', true); return false; }
      mo.packing.startedAt = now(); mo.packing.by = ACTOR_PACK;
      log(mo, 4, 'PACK_START', 'Sản xuất', 'Đóng thùng', 'Bắt đầu đóng thùng song song', 'sys');
      toast(mo.code + ' — Bắt đầu đóng thùng (song song với SX)');
      return true;
    }
    function packingFinish(mo, qty, reason) {
      if (!mo.packing.startedAt) { toast('Chưa bắt đầu đóng thùng — ' + mo.code, true); return false; }
      if (mo.packing.completedAt) { toast('Đã kết thúc đóng thùng rồi', true); return false; }
      if (!mo.steps[4]?.completedAt) { toast('Chưa Hoàn thành (đồng bộ) SX — phải Hoàn thành SX trước khi Kết thúc đóng thùng', true); return false; }
      /* Hàng tới đây là hàng ĐÃ ĐẠT — SL hỏng đã chốt ở bước Sản xuất.
         Nên chỉ hỏi đóng được bao nhiêu, và không cho vượt SL đạt của SX. */
      const tran = sxOkOf(mo);
      qty = Number(qty) || 0;
      if (qty <= 0) { toast('Nhập SL đã đóng thùng > 0', true); return false; }
      if (qty > tran) {
        toast('Đóng thùng ' + nfmt(qty) + ' vượt SL đạt của Sản xuất (' + nfmt(tran) + ')', true); return false;
      }
      reason = String(reason || '').trim();
      if (!reason) { toast('Bắt buộc nhập Lý do', true); return false; }
      mo.packing.qtyPacked = qty;        // SL đã đóng thùng — con số cộng vào tiến độ MO
      mo.packing.packingReason = reason;
      mo.packing.completedAt = now();
      const sumH = hourlySum(mo);
      const lech = (tran !== qty) ? ' — ⚠ SX đạt ' + nfmt(tran) + ' mà chỉ đóng ' + nfmt(qty)
        : (sumH && sumH !== qty ? ' — ⚠ lệch đối soát: sản lượng giờ ' + nfmt(sumH) : '');
      const duoi = mo.steps[4]?.completedAt ? Math.max(0, mo.packing.completedAt - mo.steps[4].completedAt) : null;
      const duoiTxt = duoi != null ? ' — đuôi sau SX ' + dur(duoi) : '';
      log(mo, 4, 'PACK_COMPLETE', 'Đóng thùng', 'Hoàn thành',
        'Đóng thùng ' + moTaThung(qty, quyCach(mo)) + ' / SX đạt ' + nfmt(tran) +
        ' (vòng ' + roundOf(mo) + ') — ' + reason + lech + ' — timer ' +
        dur(mo.packing.completedAt - mo.packing.startedAt) + duoiTxt, 'sys');
      toast(mo.code + ' — Kết thúc đóng thùng ' + dur(mo.packing.completedAt - mo.packing.startedAt) +
        ' · ' + moTaThung(qty, quyCach(mo)));
      return true;
    }
    /* §5 — 23A: FAIL bắt buộc lý do, ghi QC_FAIL, quay về Step1 */
    function qcDecide(mo, pass, reason) {
      if (pass) {
        mo.qc = { result: 'PASS', at: now() };
        log(mo, 2, 'QC_PASS', '', 'Chờ Bàn team leader Accept', '');
      }
      else {
        mo.qc = { result: 'FAIL', at: now(), reason };
        if (mo.steps[2]) mo.steps[2].completedAt = now();
        log(mo, 2, 'QC_FAIL', 'Step2', 'Kho (vòng mới)', reason + ' — Chưa hoàn thành → về Kho', 'rv');
        moVongMoi(mo, 'QC FAIL: ' + reason, 0);   // setup sai → phải làm lại từ Kho
      }
    }
    /* ══ SANG VÒNG MỚI ══════════════════════════════════════
       MO chưa hoàn thành thì mở một vòng chạy mới. Nhưng nó quay về ĐÂU
       phụ thuộc nguyên nhân — hai chuyện khác hẳn nhau:
    
         thiếu SL / dừng lâu → BÀN TEAM LEADER. Máy đã setup đúng, hàng đã qua QC,
                               chỉ là chưa làm đủ số. Không việc gì phải
                               in lại phiếu và setup lại từ đầu.
         QC FAIL             → KHO. Setup sai nên phải làm lại từ gốc:
                               Kho in phiếu mới, Setup chỉnh máy, QC kiểm lại.  */
    function moVongMoi(mo, reason, buocVe) {
      const done = mo.packing?.qtyPacked || 0;
      mo.qtyDone = (mo.qtyDone || 0) + done;                    // chỉ cộng SL ĐẠT đã đóng thùng
      mo.qtyNgTotal = (mo.qtyNgTotal || 0) + (mo.sx?.qtyNg || 0);  // hỏng ghi ở Sản xuất
      mo.qtyRemain = Math.max(0, mo.qty - mo.qtyDone);
      mo._loops = (mo._loops || 1) + 1;
      mo.round = roundOf(mo) + 1;

      /* Chốt sổ vòng vừa xong rồi dọn steps. Giữ nguyên thì steps[5].acceptedAt
         của vòng cũ sẽ khiến queue(5) loại MO ra vĩnh viễn. */
      (mo.stepsHistory = mo.stepsHistory || []).push({
        round: roundOf(mo) - 1,
        steps: mo.steps,
        khoAcceptedAt: mo.kho.acceptedAt,
        handedOverAt: mo.kho.handedOverAt,
        printCount: mo.kho.printCount,
        qtyPacked: mo.packing?.qtyPacked || 0,
        sxOk: mo.sx?.qtyOk != null ? mo.sx.qtyOk : null,
        qtyNg: mo.sx?.qtyNg || 0,
        sxShort: mo.sx?.qtyShort || 0,
        sxNgReason: mo.sx?.ngReason || '',
        sxShortReason: mo.sx?.shortReason || '',
        packingReason: mo.packing?.packingReason || '',
        /* batDauTu = nơi CHÍNH VÒNG NÀY đã bắt đầu (lấy trước khi đổi sang vòng mới).
           veDau giữ nguyên nghĩa cũ: nơi vòng SAU sẽ về. Hai thứ khác nhau — trộn
           lẫn là bảng hiện sai như lần QC FAIL vừa rồi. */
        batDauTu: mo.veDau == null ? 0 : mo.veDau,
        veDau: buocVe,
        reason: reason || ''
      });
      if (mo.packing?.startedAt) {
        if (!mo.packingHistory) mo.packingHistory = [];
        mo.packingHistory.push({
          startedAt: mo.packing.startedAt, completedAt: mo.packing.completedAt,
          qtyPacked: mo.packing.qtyPacked, packingReason: mo.packing.packingReason, round: roundOf(mo) - 1
        });
      }
      if (mo.qc) { (mo.qcHistory = mo.qcHistory || []).push(Object.assign({ round: roundOf(mo) - 1 }, mo.qc)); }

      mo.steps = {};
      mo.packing = {
        startedAt: null, completedAt: null, by: null, qtyPacked: null,
        packingReason: null, remain: mo.qtyRemain, done: mo.qtyDone
      };
      mo.sx = { qtyOk: null, qtyNg: null, qtyShort: null, ngReason: null, shortReason: null, at: null };
      mo.qc = null;
      mo.lastReturnReason = reason || '';
      mo.veDau = buocVe;

      if (buocVe === 0) {
        /* Về Kho: phải Accept, in phiếu, bàn giao lại từ đầu */
        mo.kho.acceptedAt = null; mo.kho.printedAt = null; mo.kho.handedOverAt = null;
        mo.step = 0;
      } else {
        /* Về Bàn team leader: mở sẵn bước 3 của vòng mới nên MO nằm luôn ở hàng đợi
           Sản xuất, chờ Line Leader quét để chạy tiếp phần còn thiếu. */
        mo.step = 3;
        mo.steps[3] = { acceptedAt: now(), completedAt: null, by: ACTOR[3] };
      }

      const ten = STEP_NM[buocVe];
      log(mo, null, buocVe === 0 ? 'RETURN_KHO' : 'RETURN_BANCHO',
        STEP_NM[5], ten + ' (Trả lại lần ' + (mo._loops - 1) + ')',
        'Đã xong ' + nfmt(mo.qtyDone) + '/' + nfmt(mo.qty) + ' — còn ' + nfmt(mo.qtyRemain) +
        ' — ' + (reason || 'Chưa hoàn thành'), 'rv');
    }

    /* §7.4 — gộp MO: 1 MO = 1 dòng, không chia SL theo line */
    function addRun(mo, line) {
      if (runsOf(mo).some(r => r.line === line)) { toast('Line L' + String(line).padStart(2, '0') + ' đã thêm cho MO này ở vòng hiện tại', true); return false; }
      mo.runs.push({
        id: 'R' + (S.runSeq++), moId: mo.id, round: roundOf(mo), line, addedAt: now(),
        targetQty: targetOf(mo),          // SL mục tiêu của vòng — dùng chia thời gian yêu cầu
        startedAt: null, completedAt: null, status: 'WAIT', segs: []
      });
      log(mo, 4, 'RUN_ADD', '', 'Chờ xử lý', 'Line ' + line + ' (vòng ' + roundOf(mo) + ')');
      return true;
    }
    function runStart(r) {
      const first = !r.startedAt;
      if (first) r.startedAt = now();
      r.segs.push({ from: now(), to: null });
      r.status = 'RUN'; r.holdReason = null; r.holdAt = null;
      log(byId(r.moId), 4, 'RUN_START', 'Chờ xử lý', 'Đang lắp ráp',
        first ? 'chờ ' + dur(waitMs(r)) + ' trước khi vào chuyền (§11B)'
          : 'chạy tiếp lần ' + r.segs.length);
    }
    /* §17 — hỏng máy: bắt buộc lý do. Không tạo Run mới, không đổi line.
       §15A — chỉ có 3 hiện trạng nên Dừng đưa line về lại Chờ xử lý. */
    function runHold(r, reason) {
      const g = r.segs.find(x => x.to == null); if (g) g.to = now();
      r.status = 'WAIT'; r.holdReason = reason;      // giữ lý do để hiện badge ĐANG DỪNG
      r.holdAt = now();
      log(byId(r.moId), 4, 'RUN_HOLD', 'Đang lắp ráp', 'Chờ xử lý', reason, 'rv');
    }
    /* Hiện tổng 3 ô ngay khi gõ — không bắt người vận hành bấm Xác nhận mới biết lệch */
    function sxTong(id) {
      const mo = byId(+id), el = document.getElementById('sxsum-' + id);
      if (!mo || !el) return;
      const muc = targetOf(mo);
      const tong = nval('sxok-' + id) + nval('sxng-' + id) + nval('sxth-' + id);
      const lech = tong - muc;
      el.textContent = lech === 0
        ? 'Σ ' + nfmt(tong) + ' — khớp'
        : 'Σ ' + nfmt(tong) + '/' + nfmt(muc) + ' — ' + (lech > 0 ? 'dư ' : 'hụt ') + nfmt(Math.abs(lech));
      el.className = 'pill ' + (lech === 0 ? 'ok' : 'bad');
    }
    /* §16 — tất cả line của 1 MO hoàn thành CÙNG LÚC, không cho hoàn thành lẻ — nút duy nhất để kết thúc SX */
    /* §16 — đóng đồng bộ mọi line, đồng thời chốt SL đạt / SL hỏng của cả MO */
    function finishAll(mo, qtyOk, qtyNg, qtyThieu, lyDoHong, lyDoThieu) {
      const rs = runsOf(mo);
      if (!rs.length) { toast('Chưa gán line nào.', true); return false; }
      /* Chốt sổ một lần cho mỗi vòng — gọi lại sẽ ghi đè SL đã khai mà không ai hay */
      if (mo.steps[4] && mo.steps[4].completedAt) {
        toast('SX vòng ' + roundOf(mo) + ' đã chốt sổ rồi.', true); return false;
      }
      const chuaChay = rs.filter(r => r.startedAt == null);
      if (chuaChay.length) { toast('Line ' + lineList(chuaChay) + ' chưa vào "Đang lắp ráp" — §16 yêu cầu đóng đồng bộ.', true); return false; }
      const dangDung = rs.filter(r => r.status === 'WAIT');   // đã từng chạy nhưng đang dừng
      if (dangDung.length) { toast('Line ' + lineList(dangDung) + ' đang dừng — cho chạy tiếp rồi mới hoàn thành đồng bộ.', true); return false; }

      qtyOk = Number(qtyOk) || 0;
      qtyNg = Number(qtyNg) || 0;
      qtyThieu = Number(qtyThieu) || 0;
      if (qtyOk < 0 || qtyNg < 0 || qtyThieu < 0) { toast('SL không được âm', true); return false; }
      /* Ba ô SL phải cộng ĐÚNG BẰNG mục tiêu vòng — đây là chốt đối soát:
         mỗi PCS giao xuống chuyền phải rơi vào đúng một trong ba nhóm
         (đạt · hỏng · không làm ra được). Lệch nghĩa là có hàng không ai
         khai — không được phép chốt sổ. */
      const muc = targetOf(mo), tong = qtyOk + qtyNg + qtyThieu, lech = tong - muc;
      if (lech !== 0) {
        toast('Đạt ' + nfmt(qtyOk) + ' + hỏng ' + nfmt(qtyNg) + ' + thiếu ' + nfmt(qtyThieu) +
          ' = ' + nfmt(tong) + ', phải đúng bằng SL cần làm vòng này (' + nfmt(muc) + ') — đang ' +
          (lech > 0 ? 'dư ' : 'hụt ') + nfmt(Math.abs(lech)), true); return false;
      }
      if (qtyOk + qtyNg <= 0) { toast('Vòng này chưa làm ra PCS nào — không có gì để chốt sổ', true); return false; }
      /* Lý do bắt buộc ở hai tình huống, không chỉ khi có hàng hỏng:
           - có hỏng   → giải thích hỏng vì gì
           - làm thiếu → giải thích vì sao không đủ (hết liệu, đổi ca, máy chậm…)
         Trước đây chỉ hỏi khi có hỏng, nên lô thiếu mà không hỏng thì mất hẳn lý do. */
      /* Hai lý do độc lập, hỏi riêng từng cái:
           - hỏng 500 vì lỗi khuôn
           - thiếu 1.000 vì chờ bù liệu
         Gộp một ô thì một trong hai chuyện mất hẳn thông tin. */
      lyDoHong = String(lyDoHong || '').trim();
      lyDoThieu = String(lyDoThieu || '').trim();
      const thieu = qtyThieu;
      if (qtyNg > 0 && !lyDoHong) {
        toast('Có ' + nfmt(qtyNg) + ' PCS hỏng — bắt buộc ghi LÝ DO HỎNG', true); return false;
      }
      if (thieu > 0 && !lyDoThieu) {
        toast('Làm thiếu ' + nfmt(thieu) + ' PCS so với mục tiêu vòng — bắt buộc ghi LÝ DO THIẾU', true); return false;
      }

      const t = now();
      rs.forEach(r => {
        const g = r.segs.find(x => x.to == null); if (g) g.to = t;
        r.completedAt = t; r.status = 'DONE';
      });
      if (mo.steps[4] && !mo.steps[4].completedAt) {
        mo.steps[4].completedAt = t;
        log(mo, 4, 'STEP4_COMPLETE', 'Sản xuất', 'Hoàn thành', 'Hoàn thành đồng bộ — SX xong ' + dur(t - mo.steps[4].acceptedAt), 'sys');
      }
      mo.sx = { qtyOk: qtyOk, qtyNg: qtyNg, qtyShort: qtyThieu, ngReason: lyDoHong, shortReason: lyDoThieu, at: t };
      log(mo, 4, 'STEP4_FINISH_ALL', 'Đang lắp ráp', 'Hoàn thành',
        rs.length + ' line đóng cùng một mốc giờ (§16) — đạt ' + nfmt(qtyOk) +
        (qtyNg ? ' · hỏng ' + nfmt(qtyNg) + ' (' + lyDoHong + ')' : '') +
        (thieu > 0 ? ' · thiếu ' + nfmt(thieu) + ' (' + lyDoThieu + ')' : ''));
      const v = moKpi(mo);
      toast('SX xong — đạt ' + nfmt(qtyOk) + (qtyNg ? ', hỏng ' + nfmt(qtyNg) : '') +
        '. KPI thời gian: ' + (v.ok ? 'ĐẠT' : 'KHÔNG ĐẠT') +
        (mo.packing.startedAt && !mo.packing.completedAt ? '. Đóng thùng vẫn chạy.' : ''));
      return true;
    }
    /* §8 — bước cuối, giữ nút Hoàn thành (step 5 Nhập kho) */
    function finishMo(mo) {
      if (mo.packing.startedAt && !mo.packing.completedAt) { toast('Đóng thùng chưa kết thúc — hãy Kết thúc đóng thùng trước', true); return false; }
      if (mo.steps[4] && !mo.steps[4].completedAt) { toast('SX chưa kết thúc — hãy Kết thúc SX trước', true); return false; }
      // Thiếu SL → không COMPLETED, quay về Kho để làm tiếp phần còn lại (2026-09-11)
      const packed = mo.packing.qtyPacked;
      const tongSauVong = (mo.qtyDone || 0) + (packed || 0);      // cộng dồn cả các vòng trước
      if (packed != null && tongSauVong < mo.qty) {
        const conLai = mo.qty - tongSauVong;
        if (mo.steps[5]) mo.steps[5].completedAt = now();
        log(mo, 5, 'MO_PARTIAL', 'Nhập kho', 'Kho (vòng mới)',
          'Vòng ' + roundOf(mo) + ' nhập ' + nfmt(packed) + ' — cộng dồn ' + nfmt(tongSauVong) + '/' + nfmt(mo.qty) +
          ' — còn ' + nfmt(conLai) + ' → CHƯA HOÀN THÀNH, về Bàn team leader', 'rv');
        moVongMoi(mo, 'Còn ' + nfmt(conLai) + ' chưa đóng thùng — về Bàn team leader làm tiếp', 3);
        toast(mo.code + ' — cộng dồn ' + nfmt(tongSauVong) + '/' + nfmt(mo.qty) +
          ' → CHƯA HOÀN THÀNH, đã về Bàn team leader để làm tiếp ' + nfmt(conLai), true);
        return false;
      }
      mo.qtyDone = tongSauVong; mo.qtyRemain = 0;
      if (mo.steps[5]) mo.steps[5].completedAt = now();
      /* Chốt sổ vòng cuối y như khi trả về Kho: SL đã gộp vào qtyDone rồi nên phải
         dọn packing, không thì mọi phép qtyDone + qtyPacked sẽ đếm lô cuối hai lần. */
      if (mo.packing.startedAt) {
        (mo.packingHistory = mo.packingHistory || []).push({
          startedAt: mo.packing.startedAt, completedAt: mo.packing.completedAt,
          qtyPacked: mo.packing.qtyPacked, packingReason: mo.packing.packingReason, round: roundOf(mo)
        });
      }
      mo.qtyNgTotal = (mo.qtyNgTotal || 0) + (mo.sx?.qtyNg || 0);
      /* Chốt sổ vòng cuối vào cùng một chỗ với các vòng trước. Trước đây chỉ
         moVongMoi ghi stepsHistory nên vòng cuối — vòng làm MO hoàn thành —
         không bao giờ hiện trong bảng truy cứu; MO xong ngay vòng 1 thì bảng trống trơn. */
      (mo.stepsHistory = mo.stepsHistory || []).push({
        round: roundOf(mo),
        steps: mo.steps,
        khoAcceptedAt: mo.kho.acceptedAt,
        handedOverAt: mo.kho.handedOverAt,
        printCount: mo.kho.printCount,
        qtyPacked: packed,
        sxOk: mo.sx?.qtyOk != null ? mo.sx.qtyOk : null,
        qtyNg: mo.sx?.qtyNg || 0,
        sxShort: mo.sx?.qtyShort || 0,
        sxNgReason: mo.sx?.ngReason || '',
        sxShortReason: mo.sx?.shortReason || '',
        packingReason: mo.packing?.packingReason || '',
        batDauTu: mo.veDau == null ? 0 : mo.veDau,
        veDau: null,
        reason: 'Hoàn thành — đủ ' + nfmt(mo.qty)
      });
      (mo.sxHistory = mo.sxHistory || []).push(Object.assign({ round: roundOf(mo) }, mo.sx));
      mo.packing = {
        startedAt: null, completedAt: null, by: null, qtyPacked: null,
        packingReason: null, remain: 0, done: mo.qtyDone
      };
      mo.sx = { qtyOk: null, qtyNg: null, qtyShort: null, ngReason: null, shortReason: null, at: null };
      mo.status = 'COMPLETED'; mo.completedAt = now();
      log(mo, 5, 'MO_COMPLETE', 'PROCESSING', 'COMPLETED', '');
      return true;
    }
    /* Ba số mỗi khung giờ, không phải một. `qty` là SẢN LƯỢNG THỰC TẾ — giữ nguyên
       tên vì mọi phép cộng dồn và đối soát với SX đạt đều đang nhìn nó.
         people  số người đứng chuyền khung đó → năng suất = qty / people
         target  sản lượng yêu cầu khung đó    → đạt % = qty / target
       Thiếu hai số kia thì con số thực tế trơ trọi: 500 cái là nhanh hay chậm,
       không có gì để so. */
    /* ══ QUY ĐỔI PCS ↔ THÙNG ═══════════════════════════════════════════════
       Đơn hàng đặt bằng PCS, mọi phép tính tiến độ chạy bằng PCS. THÙNG chỉ là
       cách ĐẾM cho nhanh ngoài xưởng. Bốn hàm dưới là chỗ DUY NHẤT hai đơn vị gặp
       nhau — quy đổi rải rác là cách chắc chắn nhất để hai bảng ra hai con số.

       Luật quyết định mọi thứ: **THÙNG CUỐI ĐƯỢC ĐÓNG THIẾU**. Đơn 3.000 với quy
       cách 800 chia ra 3 thùng đầy + 1 thùng lẻ 600 — không có nó thì đơn nào không
       chia hết cũng kẹt vĩnh viễn, vì mãi mãi thiếu vài trăm cái cho đủ thùng. */
    const quyCach = mo => mo.pcsPerBox || 0;
    const chiaThung = (pcs, qc) => !qc ? { day: 0, le: pcs } : { day: Math.floor(pcs / qc), le: pcs % qc };
    const moTaThung = (pcs, qc) => {
      if (!qc) return nfmt(pcs) + ' pcs';
      const { day, le } = chiaThung(pcs, qc);
      const phan = [];
      if (day) phan.push(day + ' thùng đầy');
      if (le) phan.push('1 thùng lẻ ' + nfmt(le));
      return nfmt(pcs) + ' pcs = ' + (phan.join(' + ') || '0 thùng');
    };
    /* Số đã LÀM RA của vòng này. Chốt sổ rồi thì lấy SL đạt; chưa thì tạm lấy Σ sản
       lượng giờ. KHÔNG dùng `sxOkOf` — hàm đó rơi về mục tiêu vòng khi chưa chốt, tức
       là cho phép đóng thùng nhiều hơn số thật sự làm được. */
    const laRaPcs = mo => (mo.sx && mo.sx.qtyOk != null) ? mo.sx.qtyOk : hourlySum(mo);
    const thungGioSum = mo => (S.packHourly || [])
      .filter(x => x.moId === mo.id && (x.round || 1) === roundOf(mo))
      .reduce((a, x) => a + x.boxes, 0);
    const daDongPcs = mo => thungGioSum(mo) * quyCach(mo);
    /* Hàng lẻ trên bàn: ĐÃ LÀM RA rồi, chỉ chưa gom đủ một thùng. Đây KHÔNG phải
       hàng thiếu (§7.5) — thiếu là chưa làm ra được, phải làm thêm. Lẻ thì không
       phải làm thêm gì cả, giờ sau gom tiếp, cuối vòng vào thùng lẻ. */
    const leTrenBan = mo => Math.max(0, laRaPcs(mo) - daDongPcs(mo));

    /* Hai con số dẫn xuất, tính một chỗ để bảng nào cũng ra cùng một cách.
       Hàng cũ lưu trước khi có `people`/`target` thì trả '—' chứ không trả 0 —
       không biết khác hẳn bằng không. */
    const datPct = (target, qty) => !target ? '—' : Math.round(qty / target * 100) + '%';
    const nangSuat = (people, qty) => !people ? '—' : (qty / people).toFixed(1) + ' cái/người';

    function addHourly(moId, slot, people, target, qty, note) {
      const mo = byId(moId); if (!mo) { toast('Chọn MO', true); return false; }
      if (!runsOf(mo).some(r => r.status === 'RUN')) { toast('Chỉ khi Đang lắp ráp mới được ghi sản lượng giờ', true); return false; }
      if (mo.packing?.completedAt) { toast('MO đã Kết thúc đóng thùng — không ghi thêm', true); return false; }
      qty = Number(qty); if (!qty || qty <= 0) { toast('Sản lượng thực tế phải >0', true); return false; }
      people = Number(people); if (!people || people <= 0) { toast('Số người phải >0', true); return false; }
      target = Number(target); if (!target || target <= 0) { toast('Sản lượng yêu cầu phải >0', true); return false; }
      if (!slot) { toast('Chọn khung giờ', true); return false; }
      const ngay = ymd(now());                    // MO chạy qua đêm thì cùng khung giờ ngày khác vẫn ghi được
      const daGhi = (S.hourly || []).filter(h => h.moId === moId && (h.round || 1) === roundOf(mo));
      if (daGhi.some(h => h.slot === slot && (h.day || '') === ngay)) {
        toast('Khung ' + ngay + ' ' + slot + ' của ' + mo.code + ' đã ghi rồi — mỗi khung mỗi ngày chỉ ghi một lần', true); return false;
      }
      const tong = daGhi.reduce((a, h) => a + h.qty, 0);
      if (tong + qty > targetOf(mo)) {
        toast('Tổng sản lượng giờ ' + nfmt(tong + qty) + ' vượt SL cần làm vòng này (' + nfmt(targetOf(mo)) + ')', true); return false;
      }
      note = String(note || '').trim();
      const id = Date.now() + Math.random();
      if (!S.hourly) S.hourly = [];
      S.hourly.push({ id, moId, round: roundOf(mo), moCode: mo.code, day: ngay, slot, people, target, qty, note, at: now(), by: ACTOR[4] });
      log(mo, 4, 'HOURLY_ADD', '', slot,
        'Thực tế ' + nfmt(qty) + ' / yêu cầu ' + nfmt(target) + ' · ' + people + ' người · giờ ' +
        (slot || '') + (note ? ' — ' + note : ''), 'sys');
      toast(mo.code + ' — ' + nfmt(qty) + '/' + nfmt(target) + ' lúc ' + slot +
        ' (' + datPct(target, qty) + ', ' + nangSuat(people, qty) + ')');
      return true;
    }

    /* Ghi số thùng đóng được trong một khung giờ. Chỉ đếm THÙNG ĐẦY.

       Vì sao không cho ghi thùng lẻ ở đây: thùng lẻ chỉ đóng khi biết chắc không còn
       hàng nào tới nữa — tức là lúc KẾT THÚC đóng thùng, không phải giữa ca. Cho ghi
       lẻ mỗi giờ thì `thùng × quy cách` hết đúng, mà đó là phép tính cả hệ thống dựa
       vào. Hàng lẻ trong giờ cứ để trên bàn, giờ sau gom tiếp. */
    function addPackHourly(moId, slot, boxes, note) {
      const mo = byId(moId); if (!mo) { toast('Chọn MO', true); return false; }
      const qc = quyCach(mo);
      if (!qc) { toast(mo.code + ' chưa khai quy cách (pcs/thùng) — không đếm thùng được', true); return false; }
      if (!mo.packing?.startedAt) { toast('Chưa bắt đầu đóng thùng — ' + mo.code, true); return false; }
      if (mo.packing.completedAt) { toast('Đã kết thúc đóng thùng — không ghi thêm', true); return false; }
      boxes = Number(boxes); if (!boxes || boxes <= 0) { toast('Số thùng phải >0', true); return false; }
      if (!slot) { toast('Chọn khung giờ', true); return false; }
      const ngay = ymd(now());
      const daGhi = (S.packHourly || []).filter(x => x.moId === moId && (x.round || 1) === roundOf(mo));
      if (daGhi.some(x => x.slot === slot && (x.day || '') === ngay)) {
        toast('Khung ' + ngay + ' ' + slot + ' của ' + mo.code + ' đã ghi rồi — mỗi khung mỗi ngày một lần', true); return false;
      }
      /* Không đóng được nhiều hơn số đã làm ra — hai sổ độc lập, đây là chỗ chúng gặp nhau. */
      const coTheDong = laRaPcs(mo);
      const sauKhiGhi = daDongPcs(mo) + boxes * qc;
      if (sauKhiGhi > coTheDong) {
        toast('Đóng ' + boxes + ' thùng = ' + nfmt(sauKhiGhi) + ' pcs, vượt số đã làm ra (' +
          nfmt(coTheDong) + ')' + (mo.sx?.qtyOk == null ? ' — ghi sản lượng giờ trước đã' : ''), true);
        return false;
      }
      note = String(note || '').trim();
      if (!S.packHourly) S.packHourly = [];
      S.packHourly.push({
        id: Date.now() + Math.random(), moId, round: roundOf(mo), moCode: mo.code,
        day: ngay, slot, boxes, pcsPerBox: qc, note, at: now(), by: ACTOR[4]
      });
      const le = leTrenBan(mo);
      log(mo, 4, 'PACK_HOURLY', '', slot,
        boxes + ' thùng × ' + nfmt(qc) + ' = ' + nfmt(boxes * qc) + ' pcs · giờ ' + slot +
        (le ? ' — còn lẻ ' + nfmt(le) : '') + (note ? ' — ' + note : ''), 'sys');
      toast(mo.code + ' — ghi ' + boxes + ' thùng (' + nfmt(boxes * qc) + ' pcs) lúc ' + slot +
        (le ? ' · lẻ trên bàn ' + nfmt(le) : ''));
      return true;
    }

    /* Đưa giờ xưởng về giờ thật. Dịch mọi mốc đã lưu theo cùng một khoảng,
       nên mọi khoảng thời gian đo được vẫn y nguyên — chỉ đổi gốc thời gian. */
    function resetClock() {
      const d = Date.now() - S.now;
      if (!d) return;
      const sh = v => (v == null ? v : v + d);
      S.mos.forEach(m => {
        m.completedAt = sh(m.completedAt);
        Object.keys(m.steps).forEach(k => {
          const st = m.steps[k]; st.acceptedAt = sh(st.acceptedAt); st.completedAt = sh(st.completedAt);
        });
        m.kho.acceptedAt = sh(m.kho.acceptedAt);
        if (m.veDau === undefined) m.veDau = 0;
        m.kho.printedAt = sh(m.kho.printedAt);
        m.kho.handedOverAt = sh(m.kho.handedOverAt);
        if (m.qc) m.qc.at = sh(m.qc.at);
        if (m.cancel) m.cancel.at = sh(m.cancel.at);
        m.runs.forEach(r => {
          r.addedAt = sh(r.addedAt); r.startedAt = sh(r.startedAt); r.completedAt = sh(r.completedAt);
          r.segs.forEach(g => { g.from = sh(g.from); g.to = sh(g.to); });
        });
        if (m.packing) { m.packing.startedAt = sh(m.packing.startedAt); m.packing.completedAt = sh(m.packing.completedAt); }
      });
      S.history.forEach(h => { h.at = sh(h.at); });
      (S.hourly || []).forEach(h => { h.at = sh(h.at); });
      (S.packHourly || []).forEach(x => { x.at = sh(x.at); });
      S.now += d;
    }

    /* ══ KPI — so THỜI GIAN ═════════════════════════════════
       Thời gian yêu cầu = thời gian lắp ráp nhập lúc tạo MO (§3A, chỉ dùng cho Step4).
       actual ≤ required → Đạt · actual > required → Không đạt.
       Vượt vẫn đếm tiếp để biết trễ bao nhiêu (§12B).
       Thời gian chờ không tính vào kết quả (§22A).
       §7.2 — actual = now − startedAt, chưa trừ thời gian dừng máy.        */
    /* Thực tế = tổng các đoạn "Đang lắp ráp". Chờ = thời gian nằm trong bảng trừ đi phần đó,
       nên lúc bấm Dừng thì đồng hồ thực tế đứng lại và đồng hồ chờ tự chạy tiếp. */
    function actualMs(r) { return r.segs.reduce((a, g) => a + ((g.to == null ? now() : g.to) - g.from), 0); }
    function waitMs(r) {
      const end = r.completedAt == null ? now() : r.completedAt;
      return Math.max(0, (end - r.addedAt) - actualMs(r));
    }
    function runKpi(r) {
      if (!r.startedAt) return null;
      const mo = byId(r.moId);
      const tq = r.targetQty || mo.qty;
      const req = Math.max(1000, Math.round(mo.requiredSec * 1000 * (tq / mo.qty)));
      const act = actualMs(r);
      return { req, act, ok: act <= req, late: Math.max(0, act - req) };
    }
    /* §21A — KPI tổng MO lấy dòng chậm nhất */
    function moKpi(mo) {
      const ks = runsOf(mo).map(runKpi).filter(Boolean);
      if (!ks.length) return null;
      return { ok: ks.every(k => k.ok), late: Math.max.apply(null, ks.map(k => k.late)) };
    }

    /* ══ Dữ liệu mẫu ════════════════════════════════════════ */

    /* ══ Hiển thị ═══════════════════════════════════════════ */
    function pills(mo) {
      const p = [];
      if (mo.status === 'CANCELLED') p.push('<span class="pill bad">Đã hủy</span>');
      if (mo.status === 'COMPLETED') p.push('<span class="pill ok">Completed</span>');
      if (remainOf(mo) > 0 && mo.status !== 'COMPLETED' && (mo.qtyDone || 0) > 0)
        p.push('<span class="pill warn">Còn ' + nfmt(remainOf(mo)) + ' / ' + nfmt(mo.qty) + '</span>');
      if ((mo._loops || 1) > 1) p.push('<span class="pill bad">Trả lại lần ' + ((mo._loops || 1) - 1) + '</span>');
      if (mo.veDau === 3 && mo.step === 3 && remainOf(mo) > 0)
        p.push('<span class="pill warn">Về Bàn team leader — làm tiếp ' + nfmt(remainOf(mo)) + '</span>');
      if (mo.step === 0 && /^QC FAIL/.test(mo.lastReturnReason || '')) p.push('<span class="pill bad">Rework</span>');
      if (mo.qc && mo.qc.result === 'PASS' && mo.step === 2) p.push('<span class="pill ok">QC Pass</span>');
      return p.join('');
    }
    const head = mo => '<div class="rhead"><span class="code">' + esc(mo.code) + '</span>' +
      '<span class="prod">' + esc(mo.product) + '</span>' + pills(mo) + '</div>';
    const meta = (mo, x) => {
      const done = mo.qtyDone || 0;
      const remain = done ? ('<span>Đã xong <b>' + nfmt(done) + '</b> / Còn <b class="calc late">' + nfmt(remainOf(mo)) + '</b></span>') : '';
      return '<div class="rmeta"><span>SL <b>' + nfmt(mo.qty) + '</b></span>' + remain +
        '<span>Yêu cầu Step4 <b>' + dur(requiredMs(mo)) + '</b></span>' + (x || '') + '</div>';
    };

    /* ── Kế hoạch ── */
    function viewPlan() {
      const mode = S.ui.mode || 'batch';
      const drafts = S.mos.filter(m => m.status === 'DRAFT');
      const tabs = '<div class="tabs">' +
        [['single', 'Tạo lẻ'], ['batch', 'Tạo hàng loạt'], ['csv', 'Import CSV']].map(([k, l]) =>
          '<button data-act="mode" data-mode="' + k + '" aria-pressed="' + (mode === k) + '">' + l + '</button>').join('') + '</div>';

      let form;
      if (mode === 'csv') {
        form = '<div class="field"><label for="csv">Mã, Tên con hàng, Số lượng, TG yêu cầu cho Step4 (phút), Quy cách pcs/thùng (tuỳ chọn)</label>' +
          '<textarea id="csv" rows="5">M076741, RSMA1004A5-001-3GT5GP-50, 10000, 180, 800\nM076742, Nắp chụp F3-B, 6000, 120, 500</textarea></div>' +
          '<div class="acts"><button class="btn primary" data-act="import">Import</button></div>';
      } else {
        const one = mode === 'single';
        form = '<div class="formgrid">' +
          (one ? '<div class="field"><label for="p-code">Mã MO (M + 6 số)</label><input type="text" id="p-code" value="M067690"></div>'
            : '<div class="field"><label for="p-start">Số bắt đầu</label><input type="number" id="p-start" value="76740" min="1" max="999999"></div>' +
            '<div class="field"><label for="p-count">Số MO (10–100)</label><input type="number" id="p-count" value="20" min="1" max="100"></div>') +
          '<div class="field"><label for="p-prod">Tên con hàng</label><input type="text" id="p-prod" value="RSMA1004A5-001-3GT5GP-50"></div>' +
          '<div class="field"><label for="p-qty">Số lượng</label><input type="number" id="p-qty" value="10000" min="1"></div>' +
          '<div class="field"><label for="p-mins">TG yêu cầu — Step4 (phút)</label><input type="number" id="p-mins" value="180" min="1"></div>' +
          '<div class="field"><label for="p-box">Quy cách (pcs/thùng)</label><input type="number" id="p-box" value="800" min="0"><span class="calc">0 = không đóng thùng. Thùng cuối được đóng thiếu.</span></div></div>' +
          '<div class="acts"><button class="btn primary" data-act="create" data-one="' + (one ? 1 : 0) + '">' +
          (one ? 'Tạo MO' : 'Tạo hàng loạt') + '</button></div>';
      }

      const rows = S.mos.map(mo => {
        const locked = mo.status !== 'DRAFT';
        return '<tr><td class="c">' + esc(mo.code) + (locked ? ' <span class="pill">khóa</span>' : '') + '</td>' +
          '<td>' + esc(mo.product) + '</td><td class="n">' + nfmt(mo.qty) + '</td>' +
          '<td class="n">' + dur(mo.requiredSec * 1000) + '</td>' +
          '<td>' + esc(mo.status) + (mo.cancel ? '<span class="calc">' + esc(mo.cancel.reason) + '</span>' : '') + '</td>' +
          '<td>' + (mo.step == null ? '—' : STEP_NM[mo.step]) + '</td>' +
          '<td class="acts">' +
          (mo.status === 'DRAFT' ? '<button class="btn primary sm" data-act="submit-one" data-mo="' + mo.id + '">Submit</button>' : '') +
          (mo.status !== 'CANCELLED' && mo.status !== 'COMPLETED'
            ? '<button class="btn ghost sm" data-act="cancel-open" data-mo="' + mo.id + '">Hủy</button>' : '') +
          '</td></tr>' +
          (S.ui.cancel === mo.id ? '<tr><td colspan="7"><div class="inline-form"><span class="lb">Lý do hủy</span>' +
            '<input type="text" id="cr-' + mo.id + '" value="Nhập sai số lượng" style="flex:1;min-width:180px">' +
            '<button class="btn danger sm" data-act="cancel" data-mo="' + mo.id + '">Xác nhận hủy</button>' +
            '<span class="lb">§4A — không sửa được, chỉ hủy rồi tạo MO mới</span></div></td></tr>' : '');
      }).join('');

      return '<div class="cols two plan">' +
        '<section class="panel"><header><h2>Tạo lệnh sản xuất</h2><span class="meta">§2.2 · 1C · 2C</span></header>' +
        '<div class="body">' + tabs + form +
        '<div class="acts"><button class="btn" data-act="submit-all"' + (drafts.length ? '' : ' disabled') +
        '>Submit hàng loạt (' + drafts.length + ' DRAFT)</button></div>' +
        '<p class="note">Cả lô chạy trong một transaction: trùng một mã thì <u>không tạo dòng nào</u>. Sau Submit, ' +
        '<u>moCode / product / quantity / requiredProductionTime</u> khóa cứng — nhập sai chỉ còn cách hủy và tạo MO mới (§4A).</p>' +
        '</div></section>' +
        '<section class="panel"><header><h2>Sổ lệnh</h2><span class="meta">' + S.mos.length + ' MO</span></header>' +
        '<div class="body flush"><div class="tscroll tall"><table><thead><tr><th>Mã MO</th><th>Con hàng</th><th>SL</th>' +
        '<th>Yêu cầu Step4</th><th>Status</th><th>Bước</th><th></th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="7" class="empty">Chưa có MO nào — tạo ở khung bên trái rồi Submit để lệnh chạy sang tab Kho.</td></tr>') + '</tbody></table></div></div></section></div>';
    }

    /* ── Kho ── */
    function slip(mo) {
      return '<div class="slip"><div class="ft">PHIẾU LỆNH SẢN XUẤT</div>' +
        '<div class="sc">' + esc(mo.code) + '</div>' +
        '<dl><dt>Tên con hàng</dt><dd>' + esc(mo.product) + '</dd>' +
        '<dt>Số lượng</dt><dd>' + nfmt(mo.qty) + ' ' + mo.unit + '</dd>' +
        '<dt>TG yêu cầu — Step4</dt><dd>' + dur(mo.requiredSec * 1000) + '</dd></dl>' +
        '<div class="qr">vùng in QR / barcode của MO Code</div>' +
        '<div class="ft">Không cần ký nhận. Step1 nhập MO Code + Accept là xem như đồng ý toàn bộ thông tin trên phiếu (§3).</div></div>';
    }
    function view0() {
      const q = queue(0), h = S.mos.filter(m => m.kho.acceptedAt && !m.kho.handedOverAt && m.status === 'PROCESSING');
      const qr = q.map(mo => '<div class="row" data-act="pick" data-code="' + esc(mo.code) + '">' + head(mo) + meta(mo) +
        '<div class="acts"><span class="pill">chờ quét</span>' +
        '<span class="pill acc">bấm dòng để nạp mã vào ô quét</span></div></div>').join('');
      const hr = h.map(mo => '<div class="row live">' + head(mo) + meta(mo) +
        '<div class="acts">' +
        '<button class="btn sm" data-act="slip" data-mo="' + mo.id + '">Xem phiếu</button>' +
        '<button class="btn primary sm" data-act="kho-handover" data-mo="' + mo.id + '">' +
        'Bàn giao → Setup</button></div>' +
        (S.ui.slip === mo.id ? slip(mo) : '') + '</div>').join('');

      return '<div class="cols two">' +
        '<section class="panel"><header><h2>Queue — MO SUBMITTED</h2><span class="meta">' + q.length + ' lệnh</span></header>' +
        '<div class="body">' +
        hopQuet(0, 'Quét QR để Kho nhận lệnh. Nhận cả lô thì dùng nút bên dưới (§7A).') +
        (qr || '<p class="empty">Không có lệnh chờ.</p>') +
        (q.length ? '<div class="acts"><button class="btn" data-act="kho-accept-all">Accept tất cả (' + q.length + ')</button></div>' : '') +
        '</div></section>' +
        '<section class="panel"><header><h2>Bàn giao xuống xưởng</h2><span class="meta">§6B · 7A</span></header>' +
        '<div class="body">' + (hr || '<p class="empty">Chưa Accept lệnh nào.</p>') +
        (h.length ? '<div class="acts"><button class="btn" data-act="kho-handover-all">Bàn giao tất cả (' + h.length + ')</button></div>' : '') +
        '<p class="note">Nhận lệnh xong là <u>bàn giao</u> luôn — không còn bước In phiếu, bớt một lần bấm. ' +
        'Chưa <u>HANDOVER</u> thì Setup không được Accept — BE chặn (§3.2). Mỗi MO ghi riêng ' +
        '<u>acceptedBy/At</u>, <u>handedOverBy/At</u>. <u>Xem phiếu</u> chỉ để xem hoặc in bằng trình duyệt, ' +
        'hệ thống không ghi sổ.</p></div></section></div>';
    }

    /* ── Trạm 1..5 ── */
    function stationRows(n) {
      return atStep(n).map(mo => {
        const s = mo.steps[n], el = stepElapsed(mo, n);
        let acts = '', extra = '';
        if (n === 2) {
          const open = S.ui.qc === mo.id;
          acts = mo.qc && mo.qc.result === 'PASS'
            ? '<span class="pill ok">PASS — chờ Bàn team leader Accept để đóng Step2</span>'
            : '<button class="btn primary sm" data-act="qc-open" data-mo="' + mo.id + '">Ra kết quả QC</button>';
          if (open) extra = '<div class="inline-form">' +
            '<button class="btn good sm" data-act="qc-pass" data-mo="' + mo.id + '">PASS</button>' +
            '<span class="lb">hoặc FAIL, bắt buộc lý do</span>' +
            '<select id="qr-' + mo.id + '">' + QC_REASONS.map(r => '<option>' + esc(r) + '</option>').join('') + '</select>' +
            '<button class="btn danger sm" data-act="qc-fail" data-mo="' + mo.id + '">FAIL → Rework</button></div>';
        } else if (n === 5) {
          acts = '<button class="btn primary sm" data-act="finish-mo" data-mo="' + mo.id + '">Hoàn thành</button>' +
            '<span class="pill acc">bước cuối — nút Complete duy nhất còn lại</span>';
        } else {
          acts = '<span class="pill acc">Không có nút Complete — đóng khi ' + STEP_NM[n + 1] + ' Accept</span>';
        }
        const extraMeta = (n === 5 && mo.packing?.qtyPacked) ? '<span>SL đóng <b>' + nfmt(mo.packing.qtyPacked) + '</b></span><span>Lý do <b>' + esc(mo.packing.packingReason || '') + '</b></span>' : '';
        return '<div class="row live">' + head(mo) +
          meta(mo, '<span>Timer bước ' + n + ' <b data-live="step:' + mo.id + ':' + n + '">' + dur(el) + '</b></span>' +
            '<span>Accept lúc <b>' + hhmm(s.acceptedAt) + '</b> · ' + esc(s.by) + '</span>' + extraMeta) +
          '<div class="acts">' + acts + '</div>' + extra + '</div>';
      }).join('');
    }
    /* Ô quét dùng chung cho mọi trạm. Ba đường vào — camera, đầu đọc cắm USB,
       gõ tay — đều đi qua cùng một bộ đọc nên quy tắc giống hệt nhau. */
    const ICON_CAM = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M3 12h18"/></svg>';
    function hopQuet(n, hint) {
      return '<div class="scan">' +
        '<input type="text" id="scan-' + n + '" placeholder="Quét / nhập MO Code…" autocomplete="off">' +
        '<button class="btn btn-cam" data-act="cam-open" title="Mở camera quét QR">' + ICON_CAM + 'Camera</button>' +
        '<button class="btn primary" data-act="scan" data-step="' + n + '">Nhận</button>' +
        '<span class="hint">' + esc(hint) + '</span></div>';
    }

    function station(n, opt) {
      const q = queue(n);
      /* Không còn nút Accept trên từng dòng: nhiều đơn cùng lúc thì rất dễ bấm
         trúng MO bên cạnh. Muốn nhận thì phải quét đúng mã của tờ phiếu đang cầm. */
      const qr = q.map(mo => '<div class="row" data-act="pick" data-code="' + esc(mo.code) + '">' +
        head(mo) + meta(mo, opt.qmeta ? opt.qmeta(mo) : '') +
        '<div class="acts"><span class="pill">chờ quét</span>' +
        '<span class="pill acc">bấm dòng để nạp mã vào ô quét</span></div></div>').join('');

      return '<div class="cols two">' +
        '<section class="panel"><header><h2>Đang ở bước ' + n + '</h2><span class="meta">' + atStep(n).length + ' MO</span></header>' +
        '<div class="body">' + (stationRows(n) || '<p class="empty">Trạm đang trống.</p>') +
        (opt.note ? '<p class="note">' + opt.note + '</p>' : '') + '</div></section>' +
        '<section class="panel"><header><h2>Hàng đợi</h2><span class="meta">' + q.length + ' MO</span></header>' +
        '<div class="body">' +
        hopQuet(n, opt.scanHint) +
        (qr || '<p class="empty">Không có MO nào chờ.</p>') +
        '</div></section></div>';
    }

    const view1 = () => station(1, {
      scan: true, acceptLabel: 'Accept / Bắt đầu Setup',
      scanHint: '§8B — quét QR là nhận luôn, không cần bấm nút. Ký tự tiền tố đầu đọc chèn vào sẽ tự bỏ. §9A — sai mã hoặc chưa bàn giao thì chặn.',
      note: 'UI Step1 chỉ có <u>một nút duy nhất</u>. Setup làm xong không bấm gì — bước này chỉ đóng khi QC Accept, và <u>completedAt = QC.acceptedAt</u>. Trách nhiệm đốc thúc QC thuộc về người Step1 (§4).'
    });

    const view2 = () => station(2, {
      scan: true, acceptLabel: 'Accept QC',
      scanHint: 'Quét QR là QC nhận luôn, Step1 tự đóng. Không cần bấm nút.',
      note: 'QC Accept làm Step1 auto-complete. Bản thân Step2 chỉ đóng khi <u>Bàn team leader Accept</u>. FAIL bắt buộc nhập lý do, ghi <u>QC_FAIL</u> và quay về Step1 (§23A).'
    });

    const view3 = () => station(3, {
      scan: true,
      scanHint: 'Quét QR để Bàn team leader nhận — QC tự đóng. Bấm dòng bên dưới để nạp mã nếu không có đầu đọc.',
      qmeta: mo => '<span>QC Pass lúc <b>' + hhmm(mo.qc.at) + '</b></span>',
      note: 'Bàn team leader Accept làm Step2 auto-complete. Step3 đóng khi <u>Line Leader Accept</u> (§6). MO <u>chưa đủ SL</u> quay về đây chứ không về Kho — máy đã setup đúng, hàng đã qua QC, chỉ là chưa làm đủ số nên không phải in lại phiếu.'
    });

    const view5 = () => station(5, {
      scan: true,
      scanHint: 'Quét QR để Nhập kho nhận — bước Sản xuất tự đóng.',
      qmeta: mo => {
        const k = moKpi(mo); const pk = mo.packing; return '<span>SL đóng <b>' + nfmt(pk.qtyPacked || 0) + '</b></span>' +
          '<span>KPI tổng <b>' + (k ? (k.ok ? 'ĐẠT' : 'KHÔNG ĐẠT') : '—') + '</b></span>' +
          (pk.startedAt ? '<span>Đóng thùng <b>' + dur((pk.completedAt || now()) - pk.startedAt) + '</b></span>' : '');
      },
      note: 'Nhập kho hiển thị <u>SL đã đóng thùng</u> đã nhập ở Kết thúc đóng thùng để đối soát. Accept Nhập kho → Timer Nhập kho START, Hoàn thành → MO COMPLETED (§8).'
    });

    /* ── Step4 ── */
    /* Line đã từng chạy nhưng hiện ở WAIT = đang dừng (§15A giữ 3 trạng thái,
       chỉ hiển thị thêm badge đỏ để phân biệt với line chưa chạy lần nào).        */
    const heldRuns = mo => runsOf(mo).filter(r => r.status === 'WAIT' && r.startedAt);

    /* C1 — Kết quả THỜI GIAN, chạy live suốt quá trình sản xuất */
    function timeCell(mo) {
      const rs = runsOf(mo).filter(r => r.startedAt);
      if (!rs.length) return '<span class="pill">chưa chạy</span>';
      const req = requiredMs(mo), act = Math.max.apply(null, rs.map(actualMs));   // hạn mức của VÒNG
      return act <= req
        ? '<span class="pill ok">Đạt</span>'
        : '<span class="pill bad">Quá giờ ' + dur(act - req) + '</span>';
    }
    /* C1 — SẢN LƯỢNG, chỉ có sau khi Kết thúc đóng thùng */
    function qtyCell(mo) {
      const sx = mo.sx, target = targetOf(mo);
      if (!sx || sx.qtyOk == null) return '<span class="pill">Chưa xong SX</span>';
      const packed = mo.packing?.qtyPacked;
      /* Cột này so SL ĐẠT với mục tiêu vòng. KHÔNG gọi phần chênh là "thiếu":
         từ "thiếu" đã có nghĩa riêng ở bước Sản xuất (SL không làm ra được),
         trong khi phần chênh ở đây = hỏng + thiếu — cả hai đều phải làm bù.
         Gọi trùng tên thì bảng báo "Thiếu 1.000" trong khi người vận hành vừa
         khai "thiếu 500", đọc vào tưởng hệ thống tính sai. */
      const buHang = target - sx.qtyOk;
      if (buHang <= 0)
        return '<span class="pill ok">Đạt ' + nfmt(sx.qtyOk) + '</span>' +
          (packed != null ? '<span class="calc">đã đóng thùng ' + nfmt(packed) + '</span>' : '');
      /* Một dòng, hết. Bảng này là bảng treo tường — liếc để biết đơn nào chưa đủ.
         Hỏng bao nhiêu · thiếu bao nhiêu · vì sao là câu hỏi thứ hai, và người hỏi
         câu thứ hai thì bấm vào truy cứu MO xem (bảng Các vòng, có cả vòng đang chạy). */
      return '<span class="pill warn">Đạt ' + nfmt(sx.qtyOk) + '/' + nfmt(target) + '</span>';
    }

    /* Sau khi Accept, Leader tick các line muốn chạy rồi nhập SL cho từng line */
    function linePicker(mo) {
      const rs = runsOf(mo);
      const done = rs.length && rs.every(r => r.status === 'DONE');
      const pick = (S.ui.pick && S.ui.pick.mo === mo.id) ? S.ui.pick.lines : [];

      const grid = Array.from({ length: LINES }, (_, i) => i + 1).map(l => {
        const busy = activeRuns().filter(r => r.line === l && r.status !== 'DONE').length;
        return '<button class="lchip" data-act="pick-line" data-mo="' + mo.id + '" data-line="' + l + '"' +
          ' aria-pressed="' + (pick.indexOf(l) >= 0) + '">L' + String(l).padStart(2, '0') +
          '<small>' + (busy ? busy + ' MO' : 'trống') + '</small></button>';
      }).join('');

      const hasLines = rs.length > 0;
      const qtyForm = !hasLines && pick.length
        ? '<div class="inline-form"><button class="btn primary sm" data-act="add-picked" data-mo="' + mo.id + '">Thêm ' + pick.length + ' line vào bảng</button><span class="lb">' + pick.map(l => 'L' + String(l).padStart(2, '0')).join(', ') + '</span></div>'
        : (hasLines && pick.length ? '<div class="inline-form"><button class="btn primary sm" data-act="add-picked" data-mo="' + mo.id + '">Thêm ' + pick.length + ' line vào bảng</button><span class="lb">' + pick.map(l => 'L' + String(l).padStart(2, '0')).join(', ') + '</span></div>' : '');

      const sxDone = mo.steps[4]?.completedAt;
      const sxBlock = sxDone
        ? '<span class="pill ok">SX xong ' + dur(sxDone - mo.steps[4].acceptedAt) + '</span>'
        : (rs.length ? '<button class="btn good sm" data-act="finish-all" data-mo="' + mo.id + '">Hoàn thành (đồng bộ tất cả line)</button>' : '');
      const sxSo = (sxDone && mo.sx && mo.sx.qtyOk != null)
        ? '<span class="pill ok">đạt ' + nfmt(mo.sx.qtyOk) + '</span>' +
        (mo.sx.qtyNg ? '<span class="pill bad">hỏng ' + nfmt(mo.sx.qtyNg) +
          (mo.sx.ngReason ? ' — ' + esc(mo.sx.ngReason) : '') + '</span>' : '') +
        (mo.sx.qtyShort ? '<span class="pill warn">thiếu ' + nfmt(mo.sx.qtyShort) +
          (mo.sx.shortReason ? ' — ' + esc(mo.sx.shortReason) : '') + '</span>'
          : (mo.sx.shortReason ? '<span class="pill warn">thiếu — ' + esc(mo.sx.shortReason) + '</span>' : ''))
        : '';
      const sxForm = (!sxDone && S.ui.sxDone === mo.id)
        ? '<div class="inline-form"><span class="lb">SL đạt</span>' +
        '<input type="number" class="num-in" id="sxok-' + mo.id + '" value="' + targetOf(mo) + '" min="0" max="' + targetOf(mo) + '" oninput="sxTong(' + mo.id + ')">' +
        '<span class="lb">SL hỏng</span>' +
        '<input type="number" class="num-in" id="sxng-' + mo.id + '" value="0" min="0" max="' + targetOf(mo) + '" oninput="sxTong(' + mo.id + ')">' +
        '<span class="lb">SL thiếu</span>' +
        '<input type="number" class="num-in" id="sxth-' + mo.id + '" value="0" min="0" max="' + targetOf(mo) + '" oninput="sxTong(' + mo.id + ')">' +
        '<span class="pill ok" id="sxsum-' + mo.id + '">Σ ' + nfmt(targetOf(mo)) + ' — khớp</span>' +
        '<span class="lb">Lý do hỏng</span>' +
        '<input type="text" id="sxngr-' + mo.id + '" placeholder="bắt buộc nếu có hỏng" style="flex:1;min-width:150px">' +
        '<span class="lb">Lý do thiếu</span>' +
        '<input type="text" id="sxthr-' + mo.id + '" placeholder="bắt buộc nếu làm thiếu" style="flex:1;min-width:150px">' +
        '<button class="btn good sm" data-act="sx-done-ok" data-mo="' + mo.id + '">Xác nhận</button>' +
        '<button class="btn ghost sm" data-act="sx-done-cancel" data-mo="' + mo.id + '">Hủy</button></div>'
        : '';
      const linesTxt = rs.length ? rs.map(r => 'L' + String(r.line).padStart(2, '0')).join(', ') : '';
      const gridSection = hasLines ? '' : '<div class="lines">' + grid + '</div>' + qtyForm;
      return '<div class="row live">' + head(mo) +
        meta(mo, '<span>SL <b>' + nfmt(mo.qty) + '</b></span>' +
          (linesTxt ? '<span>Line <b>' + esc(linesTxt) + '</b></span>' : '<span style="color:var(--warn)">chưa chọn line</span>') +
          (sxDone ? '<span>SX <b data-live="step:' + mo.id + ':4">' + dur(sxDone - mo.steps[4].acceptedAt) + '</b></span>' : '<span>SX <b data-live="step:' + mo.id + ':4">' + dur(stepElapsed(mo, 4)) + '</b></span>')) +
        gridSection +
        '<div class="acts">' + sxBlock + sxSo + '</div>' + sxForm +
        '</div>';
    }

    function view4() {
      const q = queue(4), h = atStep(4);
      const qr = q.map(mo => '<div class="row" data-act="pick" data-code="' + esc(mo.code) + '">' + head(mo) +
        meta(mo, '<span>Bàn team leader <b data-live="step:' + mo.id + ':3">' + dur(stepElapsed(mo, 3)) + '</b></span>') +
