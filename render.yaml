# Bản thiết kế triển khai cho Render — MỘT kho, HAI service, MỘT Postgres.
#
# Đọc kèm: docs/TRIEN-KHAI-RENDER.md (các bước và những chỗ phải điền tay).
#
# `sync: false` nghĩa là Render KHÔNG lấy giá trị từ file này — bạn điền trong bảng
# điều khiển. Dùng cho thứ chỉ biết sau khi service đã tồn tại (URL của nhau) hoặc
# thứ không được để lộ trong kho.

databases:
  - name: mes-db
    databaseName: mes
    user: mes
    plan: free
    # Xưởng ở Việt Nam — đặt cùng vùng với hai service để mỗi truy vấn không phải
    # vòng qua nửa vòng trái đất.
    region: singapore

services:
  # ══ Backend ══════════════════════════════════════════════════════════════
  - type: web
    name: mes-backend
    runtime: docker
    rootDir: mes-backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    # Render gọi đường này để biết service sống hay chết. `/healthz` chỉ trả {ok},
    # KHÔNG chạm CSDL — đúng loại kiểm tra cho việc này. `/readyz` có chạm CSDL,
    # để nó ở đây thì CSDL chớp một nhịp là Render giết cả service.
    healthCheckPath: /healthz
    envVars:
      # Render phát chuỗi `postgres://…`; `DatabaseSettings._ep_dung_driver`
      # trong app/common/config.py tự ghi driver `+psycopg` vào.
      - key: MES_DATABASE_URL
        fromDatabase:
          name: mes-db
          property: connectionString

      # Render sinh giá trị ngẫu nhiên một lần rồi giữ nguyên. Không bao giờ để
      # khoá ký token trong kho.
      - key: MES_JWT_SECRET
        generateValue: true

      # ĐỪNG tăng số bản sao (Scaling) và ĐỪNG đặt WEB_CONCURRENCY > 1.
      #
      # `event_bus` và `read_cache` giữ trạng thái trong bộ nhớ MỘT tiến trình. Nhiều
      # tiến trình thì SSE đẩy tới nhầm chỗ (màn hình trạm đứng im) và cache mỗi tiến
      # trình một bản (quét xong vẫn thấy số cũ) — cả hai đều KHÔNG báo lỗi.
      #
      # `app/common/single_process.py` và `docker-entrypoint.sh` chặn sẵn WEB_CONCURRENCY.
      # Số BẢN SAO thì không chặn được từ trong máy chủ — đó là thanh trượt Scaling ở
      # bảng điều khiển, và nó vẫn hỏng y hệt.
      #
      # Muốn tăng thật thì làm docs/RA-SOAT-POLLING.md §5.4 trước (đưa event_bus +
      # read_cache ra chỗ dùng chung), rồi đặt MES_ALLOW_MULTI_PROCESS=true.
      #
      # Riêng migration thì đã an toàn: `migrations/env.py` ôm khoá tư vấn của Postgres,
      # hai tiến trình cùng `alembic upgrade` sẽ xếp hàng chứ không giành nhau.
      - key: MES_ENV
        value: prod
      - key: MES_TZ
        value: Asia/Ho_Chi_Minh

      # Render phục vụ HTTPS nên bật secure được. `lax` giữ nguyên lá chắn CSRF
      # của trình duyệt — đi được vì FE proxy `/v1/*` sang đây, trình duyệt chỉ
      # thấy MỘT origin. Đừng đổi sang `none` nếu chưa làm CSRF token (BE-PLAN §6).
      - key: MES_COOKIE_SECURE
        value: "true"
      - key: MES_COOKIE_SAMESITE
        value: lax

      # 1 worker × (3 + 2) = tối đa 5 kết nối. Gói free của Postgres có trần kết
      # nối thấp, và mỗi worker giữ pool RIÊNG nên con số này nhân lên rất nhanh.
      - key: MES_DATABASE_POOL_SIZE
        value: "3"
      - key: MES_DATABASE_MAX_OVERFLOW
        value: "2"

      # KHÔNG khai MES_CORS_ORIGINS ở đây. Khai với `sync: false` thì Render hỏi
      # lúc tạo Blueprint, và bỏ trống ô đó là nó đặt CHUỖI RỖNG — pydantic không
      # phân tích được chuỗi rỗng thành danh sách nên backend chết ngay lúc khởi
      # động. Không khai thì app dùng mặc định trong config.py, vô hại: trình duyệt
      # không bao giờ gọi thẳng vào BE trong sơ đồ này (CORS không áp cho gọi
      # máy-sang-máy). Cần thật thì thêm tay trong bảng điều khiển, dạng JSON:
      #     ["https://mes-frontend-xxxx.onrender.com"]

  # ══ Frontend ═════════════════════════════════════════════════════════════
  - type: web
    name: mes-frontend
    runtime: node
    rootDir: mes-frontend
    plan: free
    region: singapore
    # Cài pnpm bằng npm, KHÔNG dùng `corepack enable`. Corepack đi kèm Node 20 mang
    # khoá ký đã cũ; khi phải hỏi registry phiên bản mới nhất nó không xác minh nổi
    # chữ ký và gãy với `Cannot find matching keyid` — lỗi chẳng liên quan gì tới dự
    # án này. Ghim thẳng phiên bản thì không có lượt hỏi nào, không có chữ ký nào
    # phải xác minh. Số này phải khớp `packageManager` trong package.json.
    #
    # `pnpm build` / `pnpm start` PHẢI gọi qua script của package.json, không phải
    # `next build` / `next start` trần: next.config.ts chọn thư mục dựng theo biến
    # `npm_lifecycle_event`. Gọi trần thì build ghi một chỗ, start tìm một chỗ khác,
    # và lỗi báo ra là "Cannot find module for page: /login".
    buildCommand: npm install -g pnpm@10.14.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"

      # URL của mes-backend, dạng https://mes-backend-xxxx.onrender.com — Render
      # gắn thêm hậu tố ngẫu nhiên nên không đoán trước được, phải chép tay sau
      # khi service backend đã dựng xong.
      - key: BACKEND_ORIGIN
        sync: false
